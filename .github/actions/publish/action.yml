name: Publish
description: >
  The ONE publish step for every workflow that writes to the repo. (1) Commits `paths` if any changed, (2) pushes with a fetch + rebase retry loop (it also pushes commits an earlier
  step or a Python helper made locally but could not push), and (3) when the push left docs/ different
  from the commit this run started on, dispatches pages-deploy.yml explicitly (`gh workflow run`). GITHUB_TOKEN pushes never fire `push`-triggered workflows, but workflow_dispatch IS
  allowed with GITHUB_TOKEN -- which is why this replaces the old workflow_run allowlist in pages-deploy.yml. The calling job needs `contents: write` and `actions: write`. Never fails the
  job: a deploy that was not dispatched is still picked up by pages-deploy.yml's 4-hourly fallback. Logic lives in publish.sh (tested by scripts/test_publish_action.py).
inputs:
  paths:
    description: >
      Space-separated paths to stage and commit (e.g. "docs/live_data.json data/"). Leave empty when an earlier step or a Python helper (--push) already committed and pushed:
      the action then only pushes anything left unpushed and decides whether to dispatch.
    required: false
    default: ''
  message:
    description: Commit message (used only when `paths` produced a change)
    required: false
    default: 'chore: data refresh'
  branch:
    description: Branch to push to
    required: false
    default: main
  on-conflict:
    description: "What to do when the rebase conflicts: 'skip' (abort, warn, try again next run) or 'prefer-mine' (rebase -X theirs: this run's side wins -- only for files this run regenerates in full)"
    required: false
    default: skip
  dispatch:
    description: "'auto' (dispatch pages-deploy.yml only if docs/ differs from the commit this run started on), 'always', or 'never'"
    required: false
    default: auto
  token:
    description: "Token used for `gh workflow run` (needs the actions: write permission)"
    required: false
    default: ${{ github.token }}
outputs:
  committed:
    description: "'1' if this step created a commit from `paths`"
    value: ${{ steps.publish.outputs.committed }}
  pushed:
    description: "'1' if nothing is left unpushed afterwards"
    value: ${{ steps.publish.outputs.pushed }}
  docs_changed:
    description: "'1' if docs/ differs from the commit this run started on"
    value: ${{ steps.publish.outputs.docs_changed }}
  dispatched:
    description: "'1' if pages-deploy.yml was dispatched"
    value: ${{ steps.publish.outputs.dispatched }}
runs:
  using: composite
  steps:
    - name: Commit, push, dispatch deploy
      id: publish
      shell: bash
      env:
        PUB_PATHS: ${{ inputs.paths }}
        PUB_MESSAGE: ${{ inputs.message }}
        PUB_BRANCH: ${{ inputs.branch }}
        PUB_ON_CONFLICT: ${{ inputs.on-conflict }}
        PUB_DISPATCH: ${{ inputs.dispatch }}
        PUB_START_SHA: ${{ github.sha }}
        PUB_WORKFLOW: pages-deploy.yml
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/publish.sh"
