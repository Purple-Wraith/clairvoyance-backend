name: Daily Social Cards Email

# ONE 'Social content' email a day (2026-10-27, owner: too many emails). This run now generates the daily/weekly/monthly/yearly/event/rotation cards AND the top-3 picks posts, queues
# every section into /tmp/cv_social_bundle (scripts/social_bundle.py) and sends them together. It replaces the separate AM/PM pick-of-day emails (pick-of-day-social-daily.yml is manual-only now).
# ~9:50 MT is when 75-97% of the day's picks are already locked (most go out the evening before), and it is the morning posting window; picks for games that already started are excluded as before.

on:
  schedule:
    # Target ~9:30 MT, offset to :52 rather than :22 -- the :22 slot sat
    # only 22min after scheduled-refresh.yml's 15:00 UTC run (0 15 * * *),
    # which is itself a heavy Playwright job with a 20min budget. On
    # 2026-08-06 this job queued for the full 15min and was cancelled
    # having NEVER been assigned a runner (runner_id 0) -- not a script
    # failure, queue starvation from two Playwright-heavy jobs clustering
    # 22min apart. :52 gives a real ~50min buffer past scheduled-refresh's
    # start instead of 22, well clear of its execution window even
    # accounting for GitHub's own queueing delay on top of it.
    - cron: '52 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Comma-separated periods to force past today''s date gate for review (weekly,monthly,yearly,alltime)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write      # the publish step dispatches pages-deploy.yml

jobs:
  generate-and-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests imageio-ffmpeg
          for i in 1 2 3; do playwright install chromium --with-deps && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Generate cards (queued for the combined email)
        id: cards
        continue-on-error: true       # a cards failure must not cost the owner the picks posts; the run still ends red below
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
          FORCE: ${{ github.event.inputs.force }}   # via env, not interpolated into the shell line
        run: |
          python scripts/generate_social_cards.py --force "$FORCE" --bundle-dir /tmp/cv_social_bundle

      - name: Generate the top-3 picks posts (queued for the combined email)
        id: picks
        continue-on-error: true       # a picks failure must not cost the owner the cards; the run still ends red below
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/generate_pick_of_day_social.py --bundle-dir /tmp/cv_social_bundle

      - name: Send the one Social content email
        id: send
        if: ${{ !cancelled() }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/social_bundle.py /tmp/cv_social_bundle

      # docs/pick_of_day.json removed 2026-09-09 -- confirmed nothing writes
      # or reads it anymore (generate_social_cards.py stopped touching it
      # at some point; app.html never referenced it either), leaving it
      # frozen since 2026-08-04 while this step committed a no-op "no
      # state change" every single day for over a month. (Milestone
      # emails also retired earlier -- data/social_milestones.json is no
      # longer written.)
      - name: Publish pick-of-day state
        uses: ./.github/actions/publish
        with:
          paths: docs/engine_performance.json docs/engine_performance_subscriber.json docs/sport_performance.json
          message: 'social-cards: pick-of-day state update'

      # GitHub's scheduled-workflow queue routinely delays this run by
      # 30-90+ minutes past the nominal 9:30 MT cron time (observed
      # consistently — not a bug in this file, just how shared-runner
      # scheduling works), so a late email is normal. A genuinely failed
      # run is not — surfaced as a workflow error annotation (Discord
      # alerting was never actually set up and has been retired).
      - name: Alert on failure
        if: ${{ always() && (steps.cards.outcome == 'failure' || steps.picks.outcome == 'failure' || steps.send.outcome == 'failure') }}
        run: |
          echo "::error::Daily Social content run did not complete cleanly (cards=${{ steps.cards.outcome }} picks=${{ steps.picks.outcome }} send=${{ steps.send.outcome }})."
          exit 1
