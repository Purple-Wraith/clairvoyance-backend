name: Daily Social Cards Email

on:
  schedule:
    # Target ~9:30 MT, offset to :52 rather than :22 -- the :22 slot sat
    # only 22min after scheduled-refresh.yml's 15:00 UTC run (0 15 * * *),
    # which is itself a heavy Playwright job with a 20min budget. On
    # 2026-08-06 this job queued for the full 15min and was cancelled
    # having NEVER been assigned a runner (runner_id 0) -- not a script
    # failure, queue starvation from two Playwright-heavy jobs clustering
    # 22min apart. :52 gives a real ~50min buffer past scheduled-refresh's
    # start instead of 22, well clear of its execution window even
    # accounting for GitHub's own queueing delay on top of it.
    - cron: '52 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Comma-separated periods to force past today''s date gate for review (weekly,monthly,yearly,alltime)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests imageio-ffmpeg
          for i in 1 2 3; do playwright install chromium --with-deps && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Generate cards and send email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python scripts/generate_social_cards.py --force "${{ github.event.inputs.force }}"

      # Pick of Day ledger (docs/pick_of_day.json — the home page's PICK OF
      # DAY tile fetches this directly) has to persist across runs so
      # yesterday's pick gets settled before today's is picked. GitHub
      # Actions runners are ephemeral, so the repo itself is the only
      # place that can hold this state. (Milestone emails retired —
      # data/social_milestones.json is no longer written.)
      - name: Commit pick-of-day state
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/pick_of_day.json docs/engine_performance.json docs/engine_performance_subscriber.json docs/sport_performance.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "social-cards: pick-of-day state update"
            if ! git push; then
              git fetch origin main
              if git rebase origin/main; then
                git push || echo "::warning::social-cards: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::social-cards: rebase conflict, skipped this state write, will retry next run"
              fi
            fi
          fi

      # GitHub's scheduled-workflow queue routinely delays this run by
      # 30-90+ minutes past the nominal 9:30 MT cron time (observed
      # consistently — not a bug in this file, just how shared-runner
      # scheduling works), so a late email is normal. A genuinely failed
      # run is not — surfaced as a workflow error annotation (Discord
      # alerting was never actually set up and has been retired).
      - name: Alert on failure
        if: failure()
        run: echo "::error::Daily Social Cards Email run did not complete."
