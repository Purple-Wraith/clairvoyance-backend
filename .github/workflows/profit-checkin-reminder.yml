name: Profit Check-In Reminder

# RETIRED as a schedule 2026-10-27 (owner: too many emails): the Monday profit check-in is now section 5 of weekly-health-digest.yml's email and the Sunday reminder is gone. This workflow
# stays only as a manual workflow_dispatch test of the old standalone email (scripts/profit_checkin_reminder.py).

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "'auto' (decide from the Mountain-time clock), 'end' or 'start'"
        required: false
        type: string
        default: auto
      dry_run:
        description: 'Log what would be sent without sending'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: profit-checkin-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send the reminder (owner only)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/profit_checkin_reminder.py --kind "${{ inputs.kind || 'auto' }}" ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Publish the sent-reminder record
        if: ${{ always() && !inputs.dry_run }}
        uses: ./.github/actions/publish
        with:
          paths: data/profit_checkin_reminders.json
          message: 'profit check-in reminder: record sent'
          dispatch: never
