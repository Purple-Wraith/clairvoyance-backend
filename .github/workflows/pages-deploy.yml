name: Deploy Pages

# Replaces GitHub's legacy "Deploy from a branch" auto-deploy, which has
# no real concurrency control -- a newer push to main just kills whatever
# deploy was already in flight, which is exactly what was showing up as
# recurring "pages build and deployment" failures (confirmed via the
# Actions API: cancelled runs with no runner ever assigned, clustering
# whenever pushes to main landed close together -- a live-score service
# pushes every ~3min on top of normal scheduled/manual commits).
#
# actions/deploy-pages has a built-in `concurrency: group: "pages"` with
# cancel-in-progress: false, so bursts of pushes queue and run in order
# instead of racing each other for a runner and losing.
#
# NOTE: activating this requires a one-time manual step this workflow file
# alone can't do -- in the repo's Settings -> Pages, change "Source" from
# "Deploy from a branch" to "GitHub Actions". Until that's flipped, GitHub
# keeps using the legacy auto-deploy (the thing causing the failures) and
# this workflow, while harmless to leave in the repo, won't be the one
# actually serving Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch: {}
  # Every data-refresh workflow below checks out+pushes with the default
  # GITHUB_TOKEN. GitHub does not let GITHUB_TOKEN-authored pushes trigger
  # other `push`-based workflows (anti-recursion rule) -- so none of these
  # ever fired the `push` trigger above, and Pages silently never picked up
  # their commits until some unrelated human/PAT-authored push happened to
  # land on main. `workflow_run` is exempt from that restriction, so this
  # fires a redeploy explicitly once each one finishes.
  #
  # Real, confirmed incident (2026-08-30): this list is an explicit
  # allowlist by name, and it had silently drifted out of date -- 11 real
  # docs/-writing workflows were missing (found via a full audit: every
  # workflow's own `git add`/python `--push` target, cross-referenced
  # against this list), several built or touched the same day this was
  # caught. The practical effect: docs/engine_performance.json,
  # docs/sport_performance.json, docs/live_data.json,
  # docs/automation_status.json (the LAST LOCK/LAST SETTLE header
  # indicator), docs/player_stats.json, and all 3 soccer schedule/
  # standings snapshots were being committed correctly but never actually
  # reaching the live site -- confirmed live: engine_performance.json's
  # generated_at sat 12+ hours stale despite 3 real successful refreshes
  # in that window. This allowlist approach is fragile by construction --
  # every NEW docs/-writing workflow has to remember to add itself here,
  # and evidently that's been missed repeatedly. The scheduled fallback
  # below exists specifically so a future miss degrades to "up to 2 hours
  # late" instead of "silently never," without needing anyone to catch it.
  workflow_run:
    workflows:
      - "CFB Rankings + FPI Refresh"
      - "CFB Roster Refresh"
      - "CFB Team Stats Refresh"
      - "Manual Data Sync"
      - "NFL Roster Refresh"
      - "NFL Team Stats + Standings Refresh"
      - "Daily Opta Soccer Stats Refresh"
      - "Scheduled Data Refresh"
      - "Daily Social Cards Email"
      - "Auto Lock + Settle"
      - "CFB Auto Lock (Early)"
      - "CFB Auto Lock (Evening — Tomorrow's Slate)"
      - "Soccer Auto Lock (Early)"
      - "Soccer Auto Lock (Evening — Tomorrow's Slate)"
      - "Landing Page Performance Refresh"
      - "Live Score Tracker"
      - "Soccer Schedule Refresh (Tomorrow)"
      # 2026-09-01 workflow consolidation: replaced CFB Schedule + Lines
      # Refresh, NFL Schedule + Lines Refresh, Daily Soccer Schedule
      # Refresh, and Daily Soccer Standings Refresh (below), and replaced
      # Daily NBA/NFL/NHL/WNBA Player Props Refresh + Daily Player Stats
      # Refresh (further below) -- see daily-schedules-refresh.yml and
      # daily-player-stats-refresh.yml's own docstrings for why.
      - "Daily Schedules + Standings Refresh"
      - "Daily Player & Prop Stats Refresh"
    types: [completed]
  schedule:
    # Fallback safety net, not the primary path -- unconditionally
    # redeploys every 2 hours regardless of whether workflow_run actually
    # fired for whatever changed docs/ most recently. A deploy of
    # unchanged content is a harmless no-op (~20s, confirmed from real
    # run durations), so this costs nothing on a normal day and only
    # matters on the day something's missing from the list above again.
    - cron: '23 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip if docs/ unchanged since last real deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "Live Score Tracker" alone dispatches this workflow up to ~72
          # times/day (every 15min, 12hr-5am MT) via the workflow_run
          # trigger below -- necessary because live scores genuinely need
          # fast redeploys, but most of those 72 completions don't actually
          # touch docs/ (no live games, or no score change that tick). Found
          # via the 2026-09-01 delay audit: this workflow alone accounted
          # for 58 of ~150 total Actions runs in a 24h sample -- by far the
          # single largest contributor to the account-wide scheduling
          # congestion behind this whole investigation. Rather than drop
          # Live Score Tracker from the allowlist (which would bring back
          # up to 2 hours of live-score staleness, unacceptable for what's
          # explicitly time-critical data), skip the expensive
          # upload+deploy steps whenever nothing in docs/ actually changed
          # since the last successful deploy -- preserves same-run
          # freshness the moment something real happens, while making every
          # no-op tick cheap instead of a full checkout+build+deploy.
          LAST_SHA=$(gh run list --workflow=pages-deploy.yml --status=success --limit=1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || echo "")
          if [ -z "$LAST_SHA" ]; then
            echo "No prior successful deploy found -- proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST_SHA" HEAD -- docs/ 2>/dev/null; then
            echo "docs/ unchanged since last deploy ($LAST_SHA) -- skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/ changed since last deploy ($LAST_SHA) -- proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
