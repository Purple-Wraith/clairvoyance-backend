name: Deploy Pages

# Replaces GitHub's legacy "Deploy from a branch" auto-deploy, which has
# no real concurrency control -- a newer push to main just kills whatever
# deploy was already in flight, which is exactly what was showing up as
# recurring "pages build and deployment" failures (confirmed via the
# Actions API: cancelled runs with no runner ever assigned, clustering
# whenever pushes to main landed close together -- a live-score service
# pushes every ~3min on top of normal scheduled/manual commits).
#
# actions/deploy-pages has a built-in `concurrency: group: "pages"` with
# cancel-in-progress: false, so bursts of pushes queue and run in order
# instead of racing each other for a runner and losing.
#
# NOTE: activating this requires a one-time manual step this workflow file
# alone can't do -- in the repo's Settings -> Pages, change "Source" from
# "Deploy from a branch" to "GitHub Actions". Until that's flipped, GitHub
# keeps using the legacy auto-deploy (the thing causing the failures) and
# this workflow, while harmless to leave in the repo, won't be the one
# actually serving Pages.

on:
  # A human / PAT push to docs/** (a bot push with the default GITHUB_TOKEN never fires this -- GitHub's anti-recursion rule).
  push:
    branches: [main]
    paths:
      - 'docs/**'
  # EVERY bot-driven deploy comes through here.  2026-10-10: the old `workflow_run` allowlist (18 workflow NAMES that had to be kept in sync by hand -- and silently drifted:
  # 11 docs-writing workflows were missing on 2026-08-30, 4 stale names on 2026-10-05) is gone.  Instead every workflow that writes to the repo ends with ONE shared step,
  # `uses: ./.github/actions/publish`, which commits + pushes (fetch/rebase retry) and then runs `gh workflow run pages-deploy.yml` when docs/ changed.  workflow_dispatch IS allowed with
  # GITHUB_TOKEN (unlike push), it needs only `actions: write` in the calling workflow, and scripts/test_workflow_refs.py fails the build if a new workflow pushes without that step.
  workflow_dispatch: {}
  schedule:
    # Fallback safety net, not the primary path -- redeploys every 4 hours regardless of whether a dispatch happened for whatever changed docs/ most recently (a dispatch can fail:
    # permissions, API outage). A deploy of unchanged content is a harmless no-op (the skip check below), so this costs nothing on a normal day and only matters the day a
    # publish step is missing or its dispatch failed: the worst case is "up to 4 hours late" instead of "silently never".
    # 2026-10-03 cleanup: every 2 h -> every 4 h (~90% of runs were no-op "docs/ unchanged" skips).
    - cron: '23 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip if docs/ unchanged since last real deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "Live Score Tracker" alone dispatches this workflow up to ~72
          # times/day (every 15min, 12hr-5am MT) via the former workflow_run
          # trigger -- necessary because live scores genuinely need
          # fast redeploys, but most of those 72 completions don't actually
          # touch docs/ (no live games, or no score change that tick). Found
          # via the 2026-09-01 delay audit: this workflow alone accounted
          # for 58 of ~150 total Actions runs in a 24h sample -- by far the
          # single largest contributor to the account-wide scheduling
          # congestion behind this whole investigation. Rather than drop
          # Live Score Tracker from the allowlist (which would bring back
          # up to 2 hours of live-score staleness, unacceptable for what's
          # explicitly time-critical data), skip the expensive
          # upload+deploy steps whenever nothing in docs/ actually changed
          # since the last successful deploy -- preserves same-run
          # freshness the moment something real happens, while making every
          # no-op tick cheap instead of a full checkout+build+deploy.
          # (2026-10-10: the publish action now only dispatches when docs/ changed, so most of those
          # no-op runs no longer start at all; this check stays as the guard for the 4-hourly fallback and for double dispatches.)
          LAST_SHA=$(gh run list --workflow=pages-deploy.yml --status=success --limit=1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || echo "")
          if [ -z "$LAST_SHA" ]; then
            echo "No prior successful deploy found -- proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST_SHA" HEAD -- docs/ 2>/dev/null; then
            echo "docs/ unchanged since last deploy ($LAST_SHA) -- skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/ changed since last deploy ($LAST_SHA) -- proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure the kickoff list is live (self-heal)
        # 2026-10-09: docs/kickoffs.json (built in the next step) is what the scheduler Worker reads to run the pre-kickoff watchdog before every game. If a no-change deploy would
        # skip while the live site has no such file yet, deploy anyway.
        if: steps.check.outputs.skip == 'true'
        run: |
          if ! curl -sfI --max-time 15 https://purple-wraith.github.io/clairvoyance-backend/kickoffs.json > /dev/null; then
            echo "kickoffs.json is not live yet -- deploying anyway."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: kick
        continue-on-error: true

      - name: Build kickoff list (for the scheduler Worker)
        if: steps.check.outputs.skip != 'true' || steps.kick.outputs.skip == 'false'
        continue-on-error: true
        run: python3 scripts/build_kickoffs.py

      - name: Setup Pages
        if: steps.check.outputs.skip != 'true' || steps.kick.outputs.skip == 'false'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true' || steps.kick.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.skip != 'true' || steps.kick.outputs.skip == 'false'
        uses: actions/deploy-pages@v4
