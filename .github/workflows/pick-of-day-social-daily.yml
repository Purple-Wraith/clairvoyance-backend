name: Daily Pick-of-Day Social Posts

on:
  schedule:
    # Real audit, 2026-09-03: the previous 18:23 UTC (~12:23pm MT) primary
    # trigger was placed in what its own comment called "the genuinely
    # open 17:00-21:00 UTC gap" -- true when this job was set up, no
    # longer true. top-picks-digest.yml has since grown two triggers
    # right in that window (17:00 and 18:00 UTC), plus
    # daily-health-check.yml (17:15), verify-lock-workflows.yml (17:30),
    # and landing-performance-refresh.yml's hourly :37 run -- recreating
    # exactly the contention this job was designed to dodge. Confirmed
    # against real run history: on 4 of the last 4 real days
    # (2026-08-30/31, 09-01/02), the 18:23 UTC primary never actually
    # produced the day's email -- it silently landed on the SECOND
    # fallback slot instead (then ~21:23 UTC, delivering ~3-5pm MT), and
    # on 09-02 even that didn't land in time, needing a manual dispatch
    # at 10:46am MT to go out at all. Moved to 16:40 UTC (~10:40am MT) --
    # safely after both the real data refresh (scheduled-refresh.yml,
    # 15:00 UTC) and CFB's own last catch-up lock (cfb-lock-early.yml,
    # 16:00 UTC), so the day's picks are genuinely complete, while
    # landing in one of the actually-quiet hours by the same real cron
    # census (only cfb-lock-early's 16:00 and auto-lock-settle's 16:20
    # nearby) -- earlier in the day than before, not later.
    - cron: '40 16 * * *'
    # Real bug, found and fixed: a single daily cron trigger has no
    # recovery if GitHub silently drops it -- documented GitHub Actions
    # behavior under high load (this repo runs 25+ scheduled workflows),
    # confirmed live multiple times (see above). Two more fallback times,
    # each a no-op if data/last_pick_of_day_date.txt already shows
    # today's date (see the "Skip if already sent" step below) -- kept
    # CLOSE to the primary (30-60min out) rather than hours later, so a
    # dropped primary still lands same late-morning window instead of
    # sliding all the way to evening.
    - cron: '10 17 * * *'
    - cron: '40 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if already sent today
        id: gate
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          LAST=$(cat data/last_pick_of_day_date.txt 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY_MT" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "already sent today ($TODAY_MT) -- this is a fallback slot, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ !steps.gate.outputs.skip }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          pip install -q playwright requests imageio-ffmpeg
          for i in 1 2 3; do playwright install chromium --with-deps && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Generate top-3-picks posts and email
        if: ${{ !steps.gate.outputs.skip }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/generate_pick_of_day_social.py

      - name: Record successful send
        if: ${{ !steps.gate.outputs.skip && success() }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_pick_of_day_date.txt
          git add data/last_pick_of_day_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record pick-of-day send for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi

      # Same rationale as social-cards-daily.yml's own failure alert --
      # GitHub's scheduled-workflow queue can delay a run by 30-90+
      # minutes past the nominal cron time on its own; that's normal.
      # A genuinely failed run is not.
      - name: Alert on failure
        if: failure()
        run: echo "::error::Daily Pick-of-Day Social Posts run did not complete."
