name: Daily Pick-of-Day Social Posts

on:
  schedule:
    # TWO separate daily emails, 2026-09-17 (explicit request, after a
    # single-run design was tried and reconsidered): one AM slate, one
    # PM slate, each independently selecting its own top 3 from whatever
    # is currently locked and not yet started (generate_pick_of_day_
    # social.py's kickoff-time filter -- see its module comment). A
    # single daily run structurally favored whichever sports lock
    # earliest (soccer/SHL/Liiga/CFB) and disregarded NFL/NBA/NHL, which
    # often aren't even locked yet by mid-morning; two runs instead give
    # both groups a real, timely shot without waiting on each other.
    # generate_pick_of_day_social.py also tracks which matchups it's
    # already featured today (data/pick_of_day_featured_today.json) so
    # the PM run can't re-post the exact same pick the AM run already
    # sent.
    #
    # AM slate: 16:40 UTC (~10:40am MT) primary + 17:10/17:40 UTC
    # (~11:10/11:40am MT) fallbacks -- unchanged from this job's original
    # timing, already well-tuned (safely after the real data refresh and
    # CFB's own last catch-up lock, so the morning's picks are genuinely
    # complete).
    - cron: '40 16 * * *'
    - cron: '10 17 * * *'
    - cron: '40 17 * * *'
    # PM slate: 22:00 UTC (~4:00pm MT) primary + 22:30/23:00 UTC
    # (~4:30/5:00pm MT) fallbacks -- after the main lock's picks for the
    # day (including afternoon/evening NFL, NBA, NHL, CFB) are locked,
    # but before most of that afternoon/evening slate has actually
    # kicked off.
    - cron: '0 22 * * *'
    - cron: '30 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slate to run for a manual dispatch (schedule triggers infer this from the hour automatically)'
        required: false
        type: choice
        options: ['am', 'pm']
        default: 'am'

permissions:
  contents: write

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine slate + skip if already sent today
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "40 16 * * *"|"10 17 * * *"|"40 17 * * *") SLOT="am" ;;
              *) SLOT="pm" ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          MARKER="data/last_pick_of_day_${SLOT}_date.txt"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          LAST=$(cat "$MARKER" 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY_MT" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "already sent today's $SLOT slate ($TODAY_MT) -- this is a fallback slot, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ !steps.gate.outputs.skip }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          pip install -q playwright requests imageio-ffmpeg
          for i in 1 2 3; do playwright install chromium --with-deps && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Generate top-3-picks posts and email
        if: ${{ !steps.gate.outputs.skip }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/generate_pick_of_day_social.py --slot ${{ steps.gate.outputs.slot }}

      - name: Record successful send
        if: ${{ !steps.gate.outputs.skip && success() }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          MARKER="${{ steps.gate.outputs.marker }}"
          echo "$TODAY_MT" > "$MARKER"
          git add "$MARKER"
          [ -f data/pick_of_day_featured_today.json ] && git add data/pick_of_day_featured_today.json
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record pick-of-day ${{ steps.gate.outputs.slot }} send for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi

      # Same rationale as social-cards-daily.yml's own failure alert --
      # GitHub's scheduled-workflow queue can delay a run by 30-90+
      # minutes past the nominal cron time on its own; that's normal.
      # A genuinely failed run is not.
      - name: Alert on failure
        if: failure()
        run: echo "::error::Daily Pick-of-Day Social Posts run did not complete."
