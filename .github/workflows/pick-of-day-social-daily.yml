name: Daily Pick-of-Day Social Posts

# RETIRED as a schedule 2026-10-27 (owner: too many emails): the top-3 picks now ride in the single daily Social content email built by social-cards-daily.yml
# (scripts/social_bundle.py). Kept only as a manual workflow_dispatch to email one slate's picks on their own if ever needed.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slate to run for a manual dispatch (schedule triggers infer this from the hour automatically)'
        required: false
        type: choice
        options: ['am', 'pm']
        default: 'am'

permissions:
  contents: write

jobs:
  generate-and-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine slate + skip if already sent today
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "50 12 * * *"|"7 13 * * *"|"50 13 * * *") SLOT="am" ;;
              *) SLOT="pm" ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          MARKER="data/last_pick_of_day_${SLOT}_date.txt"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          LAST=$(cat "$MARKER" 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY_MT" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "already sent today's $SLOT slate ($TODAY_MT) -- this is a fallback slot, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ !steps.gate.outputs.skip }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          pip install -q playwright requests imageio-ffmpeg
          for i in 1 2 3; do playwright install chromium --with-deps && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Generate top-3-picks posts and email
        id: post
        if: ${{ !steps.gate.outputs.skip }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/generate_pick_of_day_social.py --slot ${{ steps.gate.outputs.slot }}

      # Two markers, two meanings:
      #   data/last_pick_of_day_<slot>_date.txt     -- an email actually went out; the gate above skips the later fallback
      #                                                runs of this slate once it is set. Written ONLY on a real send, so a run that
      #                                                found nothing to post yet (locks not in) leaves the slate open for the fallbacks.
      #   data/last_pick_of_day_<slot>_checked.txt  -- the slate ran to completion today (sent OR legitimately nothing to post);
      #                                                this is what daily_health_check.py watches, so a quiet no-pick day is not a
      #                                                false "slate missing" alert.
      - name: Record run
        if: ${{ !steps.gate.outputs.skip && success() }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          MARKER="${{ steps.gate.outputs.marker }}"
          CHECKED="data/last_pick_of_day_${{ steps.gate.outputs.slot }}_checked.txt"
          echo "$TODAY_MT" > "$CHECKED"
          git add "$CHECKED"
          if [ "${{ steps.post.outputs.sent }}" = "1" ]; then
            echo "$TODAY_MT" > "$MARKER"
            git add "$MARKER"
          fi
          [ -f data/pick_of_day_featured_today.json ] && git add data/pick_of_day_featured_today.json
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record pick-of-day ${{ steps.gate.outputs.slot }} run for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi

      # Same rationale as social-cards-daily.yml's own failure alert --
      # GitHub's scheduled-workflow queue can delay a run by 30-90+
      # minutes past the nominal cron time on its own; that's normal.
      # A genuinely failed run is not.
      - name: Alert on failure
        if: failure()
        run: echo "::error::Daily Pick-of-Day Social Posts run did not complete."
