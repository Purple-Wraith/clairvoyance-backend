name: Auto Lock + Settle

# Server-side auto-lock (PREMIUM/OPTIMAL picks -- ML/spread/O-U for every
# sport/league with a real proprietary model, plus player props for
# NHL/NBA) and auto-settle (checks every pending bet against real
# final scores/boxscores), replacing the dead file-based settlement path
# in clairvoyance_update.py's auto_settle() (depended on a file nothing
# ever actually wrote). See scripts/auto_lock_settle.py's module
# docstring for the full design.
#
# SAFETY: scheduled runs default to dry-run (no --live flag) -- they log
# exactly what WOULD be locked/settled and write nothing.
#
# GREEN-LIGHTING LIVE RUNS: once you've reviewed enough dry-run output,
# go to Settings -> Secrets and variables -> Actions -> Variables and add
# a repo variable named LIVE_MODE with value "true". Every scheduled run
# (lock and settle) will then pass --live automatically -- no workflow
# file edit needed. Set it back to "false" (or delete it) to return to
# dry-run at any time. workflow_dispatch always lets you choose live/dry
# per-run regardless of this variable.

on:
  schedule:
    # Cut from 12 scheduled fires/day to 5 (2026-09-15), explicit request
    # to reduce Supabase egress after the 2026-09-13 quota lockout --
    # every one of these fires pulls the full bet ledger once (see
    # load_bet_ledger in auto_lock_settle.py), so fire count directly
    # drives usage. Previously: 3 dedicated lock attempts + digest +
    # adaptive + 7 settle passes. Now: 1 lock attempt (combines what used
    # to be 2 separate crons' behavior -- lock AND the final-lock-check
    # email -- into this single fire) + digest + adaptive + 2 settle
    # passes. Trades away the old redundant-lock-attempt safety margin
    # (see the retained comment below on why that redundancy existed)
    # and 5 of 7 settle passes -- accepted tradeoff for roughly half the
    # daily Supabase reads this workflow accounts for.
    #
    # RETIMED 2026-09-23, explicit request: the 4 fires were all clustered
    # before noon MT (1:20am/7:05am/8:15am/10:20am), so clairvoyanceengine
    # .info's Live Track Record (which reads the landing-perf JSON this
    # same run writes -- see the "Commit ledger backup + landing
    # performance JSON" step below) went stale for the rest of every day
    # once the 10:20am run passed, confirmed live same day comparing it
    # against the real home page. Spread across the full day instead:
    # 7:07am (lock), 12:21pm (digest+recalibration), 4:44pm (settle),
    # 10:27pm (settle) MT -- adds real afternoon/evening coverage.
    # REGRESSION, flagged not silently fixed: the old 10:20am settle
    # doubled as the 9am-12pm catch-up window's only realistic scheduled
    # landing spot (see that window's own comment further below), so a
    # dropped lock fire always got a same-day retry. Neither new settle
    # time (4:44pm/10:27pm) falls in that window, so that automatic
    # same-day recovery no longer has a natural trigger -- a dropped lock
    # now surfaces only via the lock_missed_alert (still fires, just with
    # no accompanying retry attempt) or a manual workflow_dispatch with
    # mode=catch-up.
    #
    # Real audit, 2026-09-03: confirmed live via real run history that
    # this schedule doesn't reliably land near its nominal times --
    # GitHub Actions can (and does, under load) silently drop or delay a
    # scheduled trigger. The self-healing catch-up logic below (and the
    # locked-count fix in auto_lock_settle.py) is what actually keeps
    # real locks correct regardless of how this schedule lands on any
    # given day, not the raw number of scheduled attempts. Like every
    # other MT time in this file, these are fixed UTC crons -- GitHub
    # Actions doesn't shift for DST, so real landing times drift ~1hr
    # earlier MT once MST returns in November.
    - cron: '7 13 * * *'
    # Daily settlement digest + adaptive recalibration, combined into ONE
    # fire (2026-09-16, explicit request to curb Supabase egress further --
    # each of the 5 daily fires pulls the full bet ledger at least once, so
    # cutting a fire cuts a full pull). These used to be two separate cron
    # slots 5 minutes apart (14:15 and 14:20 UTC), each launching its own
    # browser + its own load_bet_ledger() pull, even though recalibration
    # has no real dependency on the digest step itself (digest only reads
    # and emails; it commits nothing recalibration needs) -- both just
    # needed to run sometime after TODAY's settled-bet history was final,
    # which the 7:07am lock's own settle pass plus the two dedicated
    # settle fires below already guarantee regardless of exact timing.
    # One page load, one ledger pull, both steps -- same pattern already
    # used for the ledger-backup/landing-perf write in the "Run auto-lock
    # / auto-settle" step. 12:21 MT = 18:21 UTC (retimed 2026-09-23, was
    # 8:15am MT -- see the schedule-overview comment above). Yesterday's
    # results ONLY for the digest (picks locked 7/28 get their results
    # emailed the morning of 7/29, not mixed into a same-day or
    # multi-date dump); recalibration commits freshly-learned weights for
    # TOMORROW's lock to pick up, not a same-day effect. See
    # run_adaptive_recalibration/docs/adaptive_weights.json: the durable
    # fix for adaptiveTick() previously only ever writing to browser
    # localStorage, invisible to the automated headless lock pipeline.
    - cron: '21 18 * * *'
    # Settle: 2x daily, retimed 2026-09-23 (was 10:20am/1:20am MT) to
    # 4:44pm and 10:27pm MT -- gives the day real afternoon/evening
    # coverage instead of everything landing before noon (see the
    # schedule-overview comment above for why). Neither of these new
    # times falls inside the 9am-12pm lock catch-up window below anymore
    # (10:20am used to) -- that regression is called out up there too.
    # These keep bets accurate but never email -- see the 18:21 UTC
    # digest+recalibration above for the one daily email.
    - cron: '44 22 * * *'
    # RETIMED 2026-10-02 (GitHub delay audit, see european-lock-early.yml / hockey-lock-evening.yml headers for the full data).
    # The only daily lock slot used to be 13:07 UTC = 7:07 AM MT nominal, which really landed 16:59-20:03Z = 10:59 AM-2:03 PM MT
    # (+3.9..6.9h). That is AFTER NFL's 11:00 AM MT Sunday kickoffs (the late-lock audit found 36 NFL picks locked during games and
    # 7 after) and hours after the early European/CFB games. Nominal 03:50-05:45Z slots land +4.2..6.7h later = 3-6 AM MT, so the
    # primary daily lock now rides a 05:27Z slot (11:27 PM MT nominal -> lands ~4:30-6:10 AM MT): settle yesterday, then lock today
    # for every product and send the one daily subscriber email (--final-lock-check) while NFL/CFB/NHL games are still hours away.
    # It replaces the old 04:27Z settle-only slot (same settle work, plus the lock). NHL/NFL schedule + odds are re-scraped inside the
    # job first (lock_prep.py), so the 18h hockey odds-age cap is no longer cron-order luck.
    - cron: '27 5 * * *'
    # Backup main lock, gated: runs only if no main lock is recorded for today's MT date yet (data/last_lock_date.txt), so a
    # dropped/very late 05:27Z slot is retried before NFL's 11 AM MT kickoffs. A no-op slot costs one bash check.
    - cron: '7 9 * * *'
    # GATED SETTLE-ONLY slots (2026-10-02): European hockey (SHL/Liiga/NLA/Extraliga) games end at ~12-3 PM MT but the only settle
    # slots used to land 6:44-8:14 PM MT (22:44Z) and 4:30-6:10 AM MT (05:27Z), so a morning game's pick sat 'pending' for 4-17 hours
    # -- and each slot read the schedule files as last committed AND redeployed to Pages (refreshes land 2-6h late, so a game that
    # was in progress at the last scrape was not even in the file). Fix: these four slots are staggered through the afternoon /
    # evening / overnight (nominal times chosen from the observed delay bands in european-lock-early.yml: nominal 16:17Z lands
    # ~19:20-21:20Z = 1:20-3:20 PM MT, 19:37Z ~21:40-00:50Z = 3:40-6:50 PM MT, 01:17Z ~04:20-06:20Z = 10:20 PM-12:20 AM MT, 03:37Z
    # ~07:50-10:20Z = 1:50-4:20 AM MT; with the existing 22:44Z/05:27Z that is a settle-capable landing every ~2-3h). Each one is a
    # NO-OP unless there is something to settle, decided WITHOUT Supabase by scripts/settle_gate.py (see the "Pre-settle" step):
    #   stage 1 (bash+python, ~15s, no browser): is there a pending European-hockey pick in docs/picks_backup.json whose game could
    #           be over?  no -> the run ends here (no Playwright install, no scrape, no ledger pull).
    #   scrape : re-scrape the four /results/ pages INTO the checkout (scripts/refresh_hockey_results.py via lock_prep.py).
    #   stage 2: is a pending pick's game NOW final in that fresh copy, and can the app grade it?  no -> end (no ledger pull).
    #   yes    : run `auto_lock_settle.py --settle --serve-local` -- settle-only: no lock, no email -- reading the fresh checkout copy
    #           (falls back to the deployed Pages copy if the local server cannot start); then refresh picks_backup.json AFTER the
    #           settle so the next gate sees the picks as settled.
    # Egress: the only Supabase cost is the one full-ledger pull of a run that passes stage 2 -- i.e. at most one per batch of games
    # that just finished (typically 1-3 per day), never for an idle slot.
    - cron: '17 16 * * *'
    - cron: '37 19 * * *'
    - cron: '17 1 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually write to Supabase (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'Which step(s) to run'
        required: false
        type: choice
        options: ['both', 'lock', 'settle', 'daily-digest', 'adaptive-recalibration', 'catch-up']
        default: 'both'

permissions:
  contents: write

# Lock-capable slots (05:27Z, 09:07Z, 13:07Z and manual dispatch) run one at a time so two of them landing together (GitHub delays
# cluster) cannot both lock + email; the digest and settle slots share a second group so they are never cancelled in favour of a lock.
# A queued run waits; GitHub keeps only the newest pending run per group, which is fine -- every lock slot is idempotent.
#
# The four gated settle-only slots get their OWN group ('gated'): they are idempotent and mostly no-ops, and sharing 'other' would let a
# queued gated run cancel a pending digest (GitHub keeps one pending run per group). Concurrent ledger writers are safe -- the push side
# of _doSupabaseSync pulls and reconciles first and never regresses a settled row.
concurrency:
  group: auto-lock-settle-${{ (github.event.schedule == '21 18 * * *' || github.event.schedule == '44 22 * * *') && 'other' || (github.event.schedule == '17 16 * * *' || github.event.schedule == '37 19 * * *' || github.event.schedule == '17 1 * * *' || github.event.schedule == '37 3 * * *') && 'gated' || 'lock' }}
  cancel-in-progress: false

jobs:
  auto-lock-settle:
    runs-on: ubuntu-latest
    # Was 15. A lock slot now also runs the in-workflow NHL/NFL odds refresh (lock_prep.py, up to ~10 min) before the pass.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine step flags from trigger
        id: flags
        run: |
          # Landing-time log (nominal slot vs when GitHub really ran it) -- grep these to re-fit the delay model.
          echo "LANDED $(date -u +%Y-%m-%dT%H:%M:%SZ) ($(TZ=America/Denver date '+%a %m-%d %H:%M') MT) schedule='${{ github.event.schedule }}' event=${{ github.event_name }}"
          echo "LANDED $(date -u +%Y-%m-%dT%H:%M:%SZ) ($(TZ=America/Denver date '+%a %m-%d %H:%M') MT) schedule='${{ github.event.schedule }}'" >> "$GITHUB_STEP_SUMMARY"
          echo "should_run=1" >> "$GITHUB_OUTPUT"
          # Scheduled runs now honor LIVE_MODE directly, same as
          # workflow_dispatch -- the dry-run gate that held scheduled runs
          # to dry-run through 2026-08-29 regardless of LIVE_MODE has been
          # removed (monitoring period judged sufficient; explicitly
          # requested to go live immediately rather than waiting for
          # 2026-08-30).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.mode }}" in
              lock)                    echo "step_flags=--lock" >> "$GITHUB_OUTPUT" ;;
              settle)                  echo "step_flags=--settle" >> "$GITHUB_OUTPUT" ;;
              daily-digest)            echo "step_flags=--daily-digest" >> "$GITHUB_OUTPUT" ;;
              adaptive-recalibration)  echo "step_flags=--adaptive-recalibration" >> "$GITHUB_OUTPUT" ;;
              # Real gap, found live 2026-09-02: plain 'both' runs lock+
              # settle but never sets --final-lock-check, so
              # run_lock_segmented's want_email stays false and no
              # subscriber email goes out even with live=true -- fine for
              # a routine manual dry-run, but useless for manually
              # standing in for a missed scheduled catch-up (see the
              # 9am-12pm MT catch-up branch below), which is exactly the
              # situation this option exists for: locks + settles +
              # emails, same as the real catch-up would have.
              catch-up)                echo "step_flags=--lock --settle --final-lock-check" >> "$GITHUB_OUTPUT" ;;
              *)                       echo "step_flags=" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "21 18 * * *" ]; then
            # Combined 2026-09-16 (see the cron comment above) -- one
            # browser + one ledger pull instead of two separate fires.
            # Cron retimed 2026-09-23 from 15 14 * * * (8:15am MT) to this
            # (12:21pm MT) -- match string updated to match.
            echo "step_flags=--daily-digest --adaptive-recalibration" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "27 5 * * *" ]; then
            # PRIMARY pre-dawn lock (2026-10-02 retime, see the cron comment above): settle yesterday's results, lock today for every
            # product, and send the one daily subscriber email (--final-lock-check, deduped by data/last_lock_email_date.txt).
            echo "step_flags=--settle --lock --final-lock-check" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 9 * * *" ]; then
            # BACKUP lock slot: only if no main lock is recorded for today yet (marker read from origin/main -- this run's checkout
            # can predate a marker pushed by a slot that finished while this one was queued).
            TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
            git fetch --quiet --depth=1 origin main 2>/dev/null || true
            LAST_LOCK_DATE=$(git show origin/main:data/last_lock_date.txt 2>/dev/null || cat data/last_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST_LOCK_DATE" = "$TODAY_MT" ]; then
              echo "::notice::main lock already recorded for $TODAY_MT -- skipping the backup slot."
              echo "should_run=0" >> "$GITHUB_OUTPUT"
              echo "step_flags=" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::main lock NOT recorded for $TODAY_MT yet -- running the backup lock slot."
              echo "step_flags=--lock --final-lock-check" >> "$GITHUB_OUTPUT"
            fi
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 16 * * *" ] || [ "${{ github.event.schedule }}" = "37 19 * * *" ] || [ "${{ github.event.schedule }}" = "17 1 * * *" ] || [ "${{ github.event.schedule }}" = "37 3 * * *" ]; then
            # GATED SETTLE-ONLY slot (see the cron comment above). Explicit branch on purpose: falling through to the generic
            # else-branch below would let it run a catch-up LOCK (9am-12pm MT with no lock recorded) or send the lock-missed
            # alert email -- a settle-only slot must do neither.
            echo "gated=1" >> "$GITHUB_OUTPUT"
            echo "step_flags=--settle" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            # This run's checkout can predate the newest picks_backup.json / schedule commit (scheduled runs start hours late).
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" pull --rebase --autostash --quiet origin main || echo "::warning::git sync failed -- gating on the checked-out commit"
            # Stage 1 (no Supabase, no network, no browser): is there anything that could be final? Exit 1 = no.
            if python3 scripts/settle_gate.py --stage candidates; then
              echo "::notice::settle gate (stage 1): a pending European-hockey pick might be final -- continuing."
            else
              echo "::notice::settle gate (stage 1): nothing pending that could be final yet -- no-op (no browser, no Supabase)."
              echo "should_run=0" >> "$GITHUB_OUTPUT"
              echo "step_flags=" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.schedule }}" = "7 13 * * *" ]; then
            # The single daily lock check (cut from 3 dedicated attempts
            # to 1, 2026-09-15, to reduce Supabase egress) -- combines
            # lock + the final-lock-check email in one fire, since
            # there's no longer a "first two silent, third emails" split.
            # Cron retimed 2026-09-23 from 5 13 * * * (7:05am MT) to this
            # (7:07am MT) -- match string updated to match.
            echo "step_flags=--lock --final-lock-check" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          else
            # Real bug, found and fixed: this used to be a flat "anything
            # that isn't exactly the 30 14 * * * schedule string is a
            # settle-only run" -- but GitHub Actions can (and does, under
            # load) silently DROP a scheduled trigger entirely rather than
            # just delay it. Confirmed live: 2026-08-28 had zero runs where
            # github.event.schedule matched "30 14 * * *" at all -- every
            # one of that day's 4 runs fell through to settle-only, so no
            # lock pass ever ran, and nothing here would have ever noticed
            # or recovered, no matter how many more scheduled runs fired
            # later that day. data/last_lock_date.txt (written below only
            # after a real --live lock pass) is checked here so ANY run
            # that does fire can catch a missed lock, instead of every
            # future trigger depending on that one exact cron string
            # firing again.
            #
            # Catch-up window strictly bounded to 9am-12pm MT -- per
            # explicit request, lock must only ever land in the morning,
            # never afternoon/evening. Past noon with no lock yet today,
            # this fires (deduped) a same-day failure alert instead of
            # attempting a late lock that would violate that.
            TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
            HOUR_MT=$(TZ=America/Denver date +%H)
            LAST_LOCK_DATE=$(cat data/last_lock_date.txt 2>/dev/null || echo "")
            # Diagnostic: a real run on 2026-08-29 landed in the catchup
            # branch at what should have been ~9pm MT (well outside the
            # 9am-12pm bound below) -- added to self-diagnose on the next
            # occurrence rather than guessing further without more data.
            echo "::notice::step-flags debug: schedule='${{ github.event.schedule }}' TODAY_MT=$TODAY_MT HOUR_MT=$HOUR_MT LAST_LOCK_DATE=$LAST_LOCK_DATE"
            if [ "$LAST_LOCK_DATE" != "$TODAY_MT" ] && [ "$HOUR_MT" -ge 9 ] && [ "$HOUR_MT" -lt 12 ]; then
              # --final-lock-check here too -- this catch-up run is, by
              # definition, the last realistic chance to get subscribers
              # their picks that day (it only fires after all 3 scheduled
              # morning checks' windows have already passed). Without this
              # the main lock path would lock+verify but never email,
              # since it otherwise only emails on an explicit final check.
              # --settle kept alongside it, matching the original (pre-
              # this-change) catch-up behavior of also running settle.
              echo "step_flags=--lock --settle --final-lock-check" >> "$GITHUB_OUTPUT"
              echo "catchup=1" >> "$GITHUB_OUTPUT"
            else
              echo "step_flags=--settle" >> "$GITHUB_OUTPUT"
              if [ "$LAST_LOCK_DATE" != "$TODAY_MT" ] && [ "$HOUR_MT" -ge 12 ]; then
                LAST_ALERT_DATE=$(cat data/last_lock_alert_date.txt 2>/dev/null || echo "")
                if [ "$LAST_ALERT_DATE" != "$TODAY_MT" ]; then
                  echo "lock_missed_alert=1" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.flags.outputs.should_run != '0' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.flags.outputs.should_run != '0' }}
        run: |
          pip install -q playwright requests
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Pre-lock odds refresh (fail-open)
        # Lock slots only (any step_flags containing --lock): re-scrape NHL (Flashscore real prices, 18h age cap) and NFL lines right
        # now, so the pass reads what it just refreshed instead of whatever the separate refresh workflow (delayed 5-12h) last
        # committed + deployed. Best effort; pushes only when live. See scripts/lock_prep.py.
        if: ${{ steps.flags.outputs.should_run != '0' && contains(steps.flags.outputs.step_flags, '--lock') }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          TZ: America/Denver
        run: |
          PUSH_FLAG=""
          if [ "${{ steps.flags.outputs.live_flag }}" != "--live" ]; then PUSH_FLAG="--no-push"; fi
          python3 scripts/lock_prep.py --jobs nhl,nfl $PUSH_FLAG

      - name: Pre-settle results refresh + settle gate (fail-open)
        # Every settle-capable slot (gated, 22:44Z, 05:27Z, 18:21Z digest, manual settle/catch-up): re-scrape the four European
        # hockey /results/ pages into THIS checkout right before the settle logic runs, so the pass (started with --serve-local
        # below) grades against scores minutes old instead of the last full refresh + Pages redeploy. Gated slots then run stage 2
        # of scripts/settle_gate.py: only when a pending pick's game is now final does the heavy job (one Supabase ledger pull) run.
        # Other slots always run the heavy job; their stage-1 check only decides whether the re-scrape is worth the minutes.
        # Best effort: any error leaves the files as they were and (for a gated slot) lets the heavy settle run anyway.
        id: presettle
        if: ${{ steps.flags.outputs.should_run != '0' && (contains(steps.flags.outputs.step_flags, '--settle') || contains(steps.flags.outputs.step_flags, '--daily-digest')) }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          TZ: America/Denver
        run: |
          PUSH_FLAG=""
          if [ "${{ steps.flags.outputs.live_flag }}" != "--live" ]; then PUSH_FLAG="--no-push"; fi
          GATED="${{ steps.flags.outputs.gated }}"
          if [ -n "$GATED" ] || python3 scripts/settle_gate.py --stage candidates; then
            python3 scripts/lock_prep.py --jobs hockey-results $PUSH_FLAG
          else
            echo "::notice::no pending European-hockey pick could be final -- skipping the results re-scrape."
          fi
          if [ -n "$GATED" ]; then
            if python3 scripts/settle_gate.py --stage final; then
              echo "run_heavy=1" >> "$GITHUB_OUTPUT"
            else
              echo "run_heavy=skip" >> "$GITHUB_OUTPUT"
              echo "::notice::settle gate (stage 2): no pending pick's game is final in the fresh results -- no-op (no ledger pull)."
            fi
          fi

      # NOTE (2026-10-02 fix): the gate output is the sentinel 'skip', NOT '0'. GitHub expressions coerce mismatched types to numbers,
      # and an UNSET output (null) coerces to 0, so `run_heavy != '0'` was FALSE whenever the presettle step did not write it -- every
      # ungated slot (22:44Z settle, 05:27Z, 07:07 MT lock, digest...) silently skipped this whole step. 'skip' is NaN, so null != 'skip' is true.
      - name: Run auto-lock / auto-settle
        if: ${{ steps.flags.outputs.should_run != '0' && steps.presettle.outputs.run_heavy != 'skip' }}
        env:
          TZ: America/Denver
          LOCK_RESULT: ${{ runner.temp }}/lock_pass.json
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Personal daily locked-picks breakdown -- separate secret from
          # SOCIAL_CARD_EMAIL_TO on purpose (this is a private betting
          # reference, not public social content). Falls back to
          # SOCIAL_CARD_EMAIL_TO in the script if unset, but add a
          # dedicated LOCKS_EMAIL_TO repo secret to send it somewhere else.
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          if [ -n "${{ steps.flags.outputs.catchup }}" ]; then
            echo "::notice::Today's dedicated 7:07am MT lock check didn't fire -- running a catch-up lock+settle pass (this one emails, since it's the last realistic chance today)."
          fi
          # Lock AND settle-capable slots read THIS checkout's docs/ (incl. the JSON refreshed above) instead of the deployed Pages
          # copy (which lags a refresh commit by minutes and the refresh itself by hours). --serve-local falls back to the deployed
          # URL if the local server cannot start. Only lock passes write a --result-file.
          EXTRA=""
          case "${{ steps.flags.outputs.step_flags }}" in
            *--lock*) EXTRA="--serve-local --result-file $LOCK_RESULT" ;;
            *--settle*|*--daily-digest*) EXTRA="--serve-local" ;;
          esac
          python3 scripts/auto_lock_settle.py ${{ steps.flags.outputs.step_flags }} $EXTRA ${{ steps.flags.outputs.live_flag }}

      - name: Commit ledger backup + landing performance JSON
        # docs/picks_backup.json (revived 2026-09-15 as a rename of the
        # dead-since-06-10 docs/picks.json -- named distinctly so it's
        # never confused with that separate, older owner-token GitHub-
        # sync file) is a real, current GitHub-hosted backup of the
        # Supabase ledger, independent of Supabase itself, read by
        # app.html's loadPicksFromBackupJSON() as a fallback when
        # Supabase is unreachable. The 3 landing-perf files
        # (engine_performance.json, engine_performance_subscriber.json,
        # sport_performance.json -- the only files clairvoyanceengine
        # .info's Live Track Record / Sport Performance sections read)
        # ride along in the same commit. Both are written directly by
        # scripts/auto_lock_settle.py's own already-open page in the step
        # above (see write_ledger_backup/write_landing_performance), NOT
        # by a second independent browser+Supabase pull the way the
        # landing-perf refresh used to run here (2026-09-12 to 09-15) --
        # that doubled this workflow's real Supabase egress at exactly
        # the frequency that contributed to the 2026-09-13 quota lockout.
        # One page load, one ledger pull, both outputs. Uses !cancelled()
        # rather than the default success()-gate so a real failure in the
        # unrelated lock/settle step above (e.g. the Playwright-install
        # flake documented elsewhere in this repo) doesn't also skip
        # committing whatever these files WERE written before that
        # failure -- decoupled from that step's reliability, not
        # inheriting it.
        if: ${{ !cancelled() && steps.flags.outputs.should_run != '0' && steps.presettle.outputs.run_heavy != 'skip' }}
        run: |
          git add docs/picks_backup.json docs/engine_performance.json docs/engine_performance_subscriber.json docs/sport_performance.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: refresh ledger backup + landing perf $(TZ=America/Denver date +%H:%M) MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase --autostash origin/main; then
                git push origin main || echo "::warning::ledger backup/landing-perf: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::ledger backup/landing-perf: rebase conflict, skipped this refresh, will retry next run"
              fi
            fi
          fi

      - name: Record successful lock date
        # Only after a run that actually included a LIVE lock pass (the
        # dedicated 13:05 UTC slot, workflow_dispatch with lock/both, or
        # today's catch-up above) -- a dry-run, settle-only, or digest/
        # recalibration-only run must never mark today as locked, or a
        # later real catch-up would wrongly skip itself.
        #
        # Real bug, caught while combining the digest+recalibration fires
        # into one (2026-09-16): this used to be a denylist of exact
        # step_flags strings ('--settle', '--daily-digest',
        # '--adaptive-recalibration') -- the moment those two got combined
        # into a single '--daily-digest --adaptive-recalibration' string,
        # neither exact match applied, so this condition would have
        # evaluated true and wrongly recorded a lock for a run that never
        # locked anything, causing a real missed lock later that day to
        # silently skip its own catch-up. Switched to a positive allowlist
        # (does step_flags actually contain --lock) so it can't silently
        # break again the next time step_flags' possible values change.
        if: ${{ steps.flags.outputs.live_flag == '--live' && contains(steps.flags.outputs.step_flags, '--lock') }}
        run: |
          # Real failure, found via audit: this used to be a plain
          # `commit && pull --rebase && push` with no fallback -- three
          # real CI runs (2026-08-29, back-to-back within ~17 minutes,
          # each a legitimate lock pass firing close to another) hard-
          # failed the whole job here when the rebase hit a real conflict
          # in docs/automation_status.json (a concurrent run's own marker
          # commit landing on origin/main in between this step's commit
          # and its push). GH Actions runs bash with -e by default, so
          # `git pull --rebase` failing on a real conflict took the whole
          # step down with it, mid-rebase, instead of just skipping this
          # one non-critical marker write. Mirrors the fetch+rebase-then-
          # abort-on-failure pattern _commit_and_push() in
          # auto_lock_settle.py already uses for the exact same reason
          # (this repo gets pushed to from multiple concurrent jobs) --
          # only difference is this step logs and continues on conflict
          # instead of erroring, since a missed "recorded lock" marker
          # costs nothing: the next run's own write catches it up.
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_lock_date.txt
          git add data/last_lock_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record lock for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase --autostash origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi

      - name: Send lock-missed alert
        # Fires once per calendar day (deduped via data/last_lock_alert_date.txt)
        # the first time a settle-only run notices it's past noon MT with no
        # real lock yet today -- a same-day heads-up instead of relying on
        # someone noticing the header's LAST LOCK indicator on their own.
        if: ${{ steps.flags.outputs.lock_missed_alert == '1' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/auto_lock_settle.py --alert-lock-missed
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_lock_alert_date.txt
          git add data/last_lock_alert_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record lock-missed alert for $TODAY_MT"
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" pull --rebase origin main
            git push origin main
          fi
