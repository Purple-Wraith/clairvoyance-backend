name: SHL/Liiga Auto Lock (Evening — Tomorrow's Slate)

# Evening-prior + pre-dawn lock for SHL/Liiga/NLA/Extraliga (the Hockey product's European leagues). NHL is not in this pass (it
# never plays this early; the main run covers it). Originally a single "10:15 PM MT, lock TOMORROW's games" slot.
#
# WHAT CHANGED 2026-10-02 -- see the delay data below. Three real defects, all fixed:
#  1. ROLLING HORIZON. The pass locked "tomorrow" relative to when it RAN. GitHub ran the 10:15 PM MT slot at ~4:30 AM MT -- after
#     midnight -- so "tomorrow" was the day AFTER the games about to start (SHL 7:15 AM MT that same morning): those were left to
#     the same-morning workflow, which landed at 11 AM-1:49 PM MT, i.e. after the games. The pass now covers today AND tomorrow
#     (auto_lock_settle.py horizon_dates / gather_hockey_legs_for_dates); picks are stamped with each game's own date.
#  2. STALE ODDS. Hockey legs qualify only on a real price younger than 18h (HOCKEY_ODDS_MAX_AGE_H). The odds this read came from
#     whichever refresh workflow last ran + deployed, so a pass could see 10-19h-old odds and qualify nothing, then record "success"
#     and stop the catch-ups. Each slot now scrapes first (scripts/lock_prep.py) and reads the checkout it just refreshed.
#  3. SUCCESS != DONE. The marker was written after any pass that did not crash, even one that found zero picks because odds were
#     missing or every game had started. It is now written only by a COMPLETE pass.
# Subscriber emails: unchanged triggers (a pass that locks something NEW emails; one that finds nothing new does not). New: the
# "no picks cleared the bar" email is no longer sent when the pass is late (games already started) or incomplete (odds not posted).
#
# RETIMED 2026-10-02 (GitHub delay audit, 300 real runs per workflow, `gh run list --json createdAt`): scheduled workflows in
# this repo land LATE and the lateness depends on the nominal UTC time of day --
#   nominal 17:00-23:00 UTC  -> lands +2.0 to +5.3 h later   (e.g. 20:00-21:00Z +2.4..4.2h, 22:44Z +2.0..3.5h, 21:13Z +3.1..3.6h)
#   nominal 03:50-05:45 UTC  -> lands +4.2 to +6.7 h later   (the old evening slots: landed 08:20-12:01Z = 2:20-6:01 AM MT)
#   nominal 11:30-13:00 UTC  -> lands +3.1 to +7.4 h later   (the old same-morning slots: landed 15:08-19:49Z = 9:08 AM-1:49 PM MT)
# and the delay has GROWN ~2h over the last 3 weeks (the 04:00Z evening slots landed at +4.4h on 09-12, +6.7h on 10-01), with the
# worst days on Mondays. So one slot per window, timed from the nominal clock, is not safe: the old 6:00 AM MT same-morning pass
# really ran 9 AM-1:49 PM MT, after every SHL (7:15 AM MT) and Liiga (9:30 AM MT) game -- which is why ~55 of 174 settled European
# hockey picks were locked after the game started. The fix is layers, not one lucky slot: an EVENING batch (lands ~5-8:40 PM MT the
# day before), a MID-NIGHT batch, and a PRE-DAWN batch (lands ~3-6 AM MT), plus a late same-day catch-up workflow. Each slot is
# gated by a cheap bash check, so only the first COMPLETE pass of each MT calendar day pays for a runner + browser.
#
# Slots (nominal UTC / MT) and expected landing (observed delay by nominal time): 20:40Z=2:40PM -> ~5:00-6:50 PM MT; 22:10Z=4:10PM
# -> ~6:10-7:40 PM MT; 01:30Z=7:30PM -> ~11 PM-1 AM MT (extrapolated, no observations yet); 03:00Z=9PM -> ~1-3:30 AM MT;
# 04:30Z=10:30PM -> ~3:30-5:10 AM MT; 05:30Z=11:30PM -> ~4:10-6:10 AM MT. SHL's first game is 7:15 AM MT (13:15Z): even the worst
# observed landing of the last slot (12:01Z) leaves ~75 min; the earlier slots leave hours. Minutes are staggered against the soccer
# and CFB evening workflows (runner-queue starvation when slots coincide).

on:
  schedule:
    # 2:40 PM MT (MDT) -- evening batch
    - cron: '40 20 * * *'
    # 4:10 PM MT -- evening batch
    - cron: '10 22 * * *'
    # 7:30 PM MT -- mid-night batch
    - cron: '30 1 * * *'
    # 9:00 PM MT -- mid-night batch
    - cron: '0 3 * * *'
    # 10:30 PM MT -- pre-dawn batch (the old 10:15 PM slot family)
    - cron: '30 4 * * *'
    # 11:30 PM MT -- last pre-dawn slot
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually write to Supabase (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write      # the publish step dispatches pages-deploy.yml

# One run at a time per workflow (several slots can land within the same minute after a GitHub delay). A queued run waits for the
# running one; GitHub keeps only the newest pending run, which is fine -- every slot is idempotent and gated.
concurrency:
  group: hockey-lock-evening
  cancel-in-progress: false

jobs:
  hockey-lock-evening:
    runs-on: ubuntu-24.04
    # Was 10 min. Now includes the in-workflow odds refresh (lock_prep.py: ~1-5 min) before the lock pass.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Private data (subscriber list)
        continue-on-error: true
        uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Determine live flag + whether to run
        # Pure bash (no Python/Playwright yet): a slot that finds today's pass already COMPLETE costs one fast check instead of a
        # runner + browser install. The marker is written (below) only by a pass that finished complete, so an incomplete pass
        # (e.g. an upcoming game still has no real price) lets the next slot try again.
        id: flags
        run: |
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          NOW_MT=$(TZ=America/Denver date '+%a %m-%d %H:%M')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            # Read the marker from origin/main, not just the checked-out commit: a run queued behind another slot of this workflow
            # (concurrency group) was checked out BEFORE that slot pushed its marker.
            git fetch --quiet --depth=1 origin main 2>/dev/null || true
            LAST=$(git show origin/main:data/last_hockey_evening_lock_date.txt 2>/dev/null || cat data/last_hockey_evening_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST" = "$TODAY_MT" ]; then
              echo "should_run=0" >> "$GITHUB_OUTPUT"
              echo "::notice::SHL/Liiga evening lock: a complete pass is already recorded for $TODAY_MT -- skipping this slot (schedule=${{ github.event.schedule }})."
            else
              echo "should_run=1" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Landing-time log: nominal slot vs when GitHub really ran it. Grep these lines to re-fit the delay model.
          echo "LANDED $NOW_UTC ($NOW_MT MT) schedule='${{ github.event.schedule }}' event=${{ github.event_name }}"
          echo "LANDED $NOW_UTC ($NOW_MT MT) schedule='${{ github.event.schedule }}'" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: ${{ steps.flags.outputs.should_run == '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.flags.outputs.should_run == '1' }}
        run: |
          pip install -q playwright requests
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done

      - name: Pre-lock odds refresh (fail-open)
        # Deterministic freshness: scrape what the lock is about to read, right now, instead of hoping the separate refresh
        # workflows (delayed 5-12h) happened to run first. Best effort -- a failure leaves the previous JSON and the lock behaves
        # exactly as before. Pushes only when live (a dry run must not commit anything). See scripts/lock_prep.py.
        if: ${{ steps.flags.outputs.should_run == '1' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          TZ: America/Denver
        run: |
          PUSH_FLAG=""
          if [ "${{ steps.flags.outputs.live_flag }}" != "--live" ]; then PUSH_FLAG="--no-push"; fi
          python3 scripts/lock_prep.py --jobs hockey $PUSH_FLAG

      - name: Run SHL/Liiga/NLA/Extraliga rolling-horizon auto-lock
        if: ${{ steps.flags.outputs.should_run == '1' }}
        env:
          TZ: America/Denver
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
          LOCK_RESULT: ${{ runner.temp }}/lock_pass.json
        # --serve-local: the pass reads THIS checkout's docs/ (incl. the JSON refreshed above), not the deployed Pages copy.
        # (The python3 command stays the FIRST line of the script: verify_lock_workflows.py finds it via the "##[group]Run" header.)
        run: |
          python3 scripts/auto_lock_settle.py --lock --only-hockey-tomorrow --serve-local --result-file "$LOCK_RESULT" ${{ steps.flags.outputs.live_flag }}

      - name: Record successful SHL/Liiga evening lock date
        # Only after a LIVE pass that finished COMPLETE (see _run_rolling_pass/_zero_pick_decision: nothing failed and every
        # upcoming game it saw had a real price). An incomplete pass records nothing, so the next slot tries again; a dry run
        # never records.
        if: ${{ steps.flags.outputs.should_run == '1' && steps.flags.outputs.live_flag == '--live' }}
        env:
          LOCK_RESULT: ${{ runner.temp }}/lock_pass.json
        run: |
          COMPLETE=$(python3 -c "import json,os; print(json.load(open(os.environ['LOCK_RESULT'])).get('complete'))" 2>/dev/null || echo "False")
          if [ "$COMPLETE" != "True" ]; then
            echo "::notice::pass not complete (or no result file) -- marker NOT recorded; a later slot will run again."
            exit 0
          fi
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_hockey_evening_lock_date.txt
          git add data/last_hockey_evening_lock_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record SHL/Liiga evening lock for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              # --autostash: a dirty tracked file must not make the rebase refuse to run (it silently skipped marker writes before)
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase --autostash origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi

      - name: Publish (deploy Pages for anything the lock pass pushed)
        # lock_prep.py / auto_lock_settle.py push docs/ files themselves (refreshed schedule JSON, automation_status.json, the ledger backup); this shared step dispatches pages-deploy.yml
        # if that left docs/ different from the commit this run started on, and mirrors the ledger backup to R2 (a logged no-op until the R2 secrets exist).
        if: ${{ !cancelled() && steps.flags.outputs.should_run == '1' }}
        uses: ./.github/actions/publish
        with:
          r2-files: docs/picks_backup.json docs/picks_backup_meta.json
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
