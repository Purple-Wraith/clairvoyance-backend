name: Top Picks Digest

# Owner-only email (clairvoyanceengine@gmail.com ONLY, never the
# subscriber lists auto-lock-settle.yml's own locks emails use) ranking
# that day's already-locked picks by model win probability -- top 4 per
# league, top 7 overall, with parlay math. See scripts/auto_lock_settle.py's
# build_top_picks_digest()/send_top_picks_digest_email() for the content.
#
# Deliberately a SEPARATE workflow from auto-lock-settle.yml, not another
# step tacked onto it -- this is a lower-stakes convenience feature, and
# it must never be able to add risk or complexity to the actual lock/
# settle pipeline real subscribers depend on.
#
# Timing, found via real audit: this used to fire right after the main
# lock's 7:35am MT final check, but CFB doesn't lock until 9:00-10:00am
# MT (cfb-lock-early.yml) -- meaning every digest would have gone out
# BEFORE CFB was locked, silently omitting CFB entirely (in real data,
# CFB was the single largest contributor: 19 of 33 picks on a sampled
# day, 5 of that day's top 7 overall). EXPLICITLY verifying both
# data/last_lock_date.txt and data/last_cfb_lock_date.txt already show
# today's date before sending -- not just assuming enough time has
# passed -- is what actually prevents that regardless of what triggers
# this run. If either hasn't recorded yet, this attempt skips (not
# sends incomplete) and the next attempt retries.
#
# Second real audit, 2026-09-03: a fixed-time schedule (even after
# moving it earlier once already) is fundamentally the wrong tool here
# -- it's guessing how long real locking takes instead of reacting to
# it. Confirmed live: on 2026-08-31/09-01/09-02, every nominal slot
# landed ~3 hours late (a GitHub Actions scheduling-congestion issue,
# not this workflow's own logic), and on 2026-09-03 the very day this
# was first fixed, the schedule change itself landed AFTER that day's
# early slots had already passed, so NONE of them fired at all that
# day. A fixed clock time can't be both "early" and "safe" when the
# thing it's actually waiting on (CFB's own lock, which itself runs on
# catch-up slots and can finish anywhere from ~9am to ~10:45am MT) has
# no fixed duration. Switched to workflow_run, firing directly off the
# real completion of both gating lock workflows -- this sends within
# a couple minutes of whichever one finishes LAST each day, whatever
# time that actually turns out to be, rather than a guessed buffer.
# The existing marker-file readiness check (unchanged) is what actually
# gates a real send either way, so this is strictly an improvement, not
# a new failure mode: workflow_run firing "too early" (the other lock
# not done yet) just skips exactly like an early schedule slot always
# has, and every catch-up opportunity (the lock workflows' OWN retry
# slots, each of which re-triggers this) still applies.
on:
  workflow_run:
    workflows:
      - "Auto Lock + Settle"
      - "CFB Auto Lock (Early)"
    types: [completed]
  schedule:
    # Fallback safety net only now, not the primary path -- covers the
    # case where GitHub drops the workflow_run trigger itself (the same
    # class of silent-drop behavior already confirmed elsewhere in this
    # repo's own scheduled workflows). Two widely-spaced slots is enough
    # for a true backstop since workflow_run should be doing the real
    # work above.
    # Minutes nudged off :30 2026-09-09 (account-wide congestion cleanup).
    - cron: '43 17 * * *'
    - cron: '43 19 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually send the email (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  top-picks-digest:
    # workflow_run fires on every completion of either gating lock
    # workflow regardless of outcome (types: [completed]) -- skip
    # outright on a FAILED triggering run (nothing new to check; the
    # marker files can't have moved) rather than spending even the cheap
    # readiness-check step on it. schedule/workflow_dispatch runs (no
    # workflow_run context) always pass this check. Same condition
    # pages-deploy.yml already uses for its own workflow_run trigger.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Readiness check moved ahead of the Python/Playwright setup --
      # real audit finding: with workflow_run now firing on every
      # completion of either gating lock workflow (each of which retries
      # on its own catch-up slots through the morning), most invocations
      # on a given day are expected to land before both locks are done
      # and just skip. Installing Playwright before knowing that meant
      # every one of those paid the full install cost for nothing --
      # this makes a skip a few-second checkout instead.
      - name: Determine live flag and readiness
        id: flags
        env:
          TZ: America/Denver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            TODAY_MT=$(date +%Y-%m-%d)
            LAST_DIGEST=$(cat data/last_top_picks_digest_date.txt 2>/dev/null || echo "")
            LAST_LOCK=$(cat data/last_lock_date.txt 2>/dev/null || echo "")
            LAST_CFB=$(cat data/last_cfb_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST_DIGEST" = "$TODAY_MT" ]; then
              echo "::notice::Top picks digest already sent for $TODAY_MT -- skipping."
              echo "should_run=0" >> "$GITHUB_OUTPUT"
            elif [ "$LAST_LOCK" != "$TODAY_MT" ] || [ "$LAST_CFB" != "$TODAY_MT" ]; then
              echo "::notice::Top picks digest: today's main lock ($LAST_LOCK) or CFB lock ($LAST_CFB) not yet recorded for $TODAY_MT -- skipping this attempt, the next lock completion (or fallback slot) will retry."
              echo "should_run=0" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: ${{ steps.flags.outputs.should_run == '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.flags.outputs.should_run == '1' }}
        run: |
          pip install -q playwright requests
          playwright install --with-deps chromium

      - name: Send top picks digest
        if: ${{ steps.flags.outputs.should_run == '1' }}
        env:
          TZ: America/Denver
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 scripts/auto_lock_settle.py --top-picks-digest ${{ steps.flags.outputs.live_flag }}

      - name: Record successful digest send
        # Only after a run that actually included a LIVE send -- a
        # dry-run must never mark today as done, or a later real
        # catch-up would wrongly skip itself.
        if: ${{ steps.flags.outputs.should_run == '1' && steps.flags.outputs.live_flag == '--live' }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_top_picks_digest_date.txt
          git add data/last_top_picks_digest_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record top picks digest sent for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi
