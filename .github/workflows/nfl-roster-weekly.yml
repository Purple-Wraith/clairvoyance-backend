name: NFL Roster Refresh

# Changed from monthly to weekly per explicit request -- keeps venue
# capacity/indoor status and any roster-adjacent detail fresher than a
# once-a-month cadence, even though division membership itself
# essentially never changes mid-season (no realignment risk like CFB).

on:
  schedule:
    # ~Monday 6:00 AM MT = 12:00 UTC (MDT) / 13:00 UTC (MST). Minute
    # nudged off :00 2026-09-09 (account-wide congestion cleanup).
    - cron: '23 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-nfl-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests
      - name: Refresh roster and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_nfl.py --mode roster --push
