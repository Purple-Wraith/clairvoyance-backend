name: Daily Opta Soccer Stats Refresh

# Keeps the Bundesliga/Premier League/Serie A/MLS team-stats reference data
# and the _SOC_XG win-probability fallback table in docs/app.html current —
# without this, the model's xG numbers and rosters freeze at whatever was
# last scraped (exactly what had happened before this workflow existed:
# relegated/promoted clubs like Ipswich, Venezia, and VfL Bochum were still
# in the table months after they left their leagues).
#
# This used to run twice daily (11:00 and 16:00 UTC). The 16:00 UTC pass
# was folded into daily-player-stats-refresh.yml as part of the 2026-09-01
# health-check audit's workflow-consolidation pass (that hour had 6 separate
# scheduled workflows dispatching within the same 60 minutes, a real
# contributor to the account-wide multi-hour scheduling delays found that
# day) -- only the 11:00 UTC morning pass remains here.

on:
  schedule:
    # 5:00 AM MT = 11:00 UTC (MDT) / 12:00 UTC (MST) — well after Opta's own
    # nightly data update, off-peak minute to avoid GitHub's scheduled-
    # workflow queue congestion at round cron minutes.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-opta-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          playwright install chromium --with-deps

      - name: Scrape and push
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/scrape_opta_stats.py --push
