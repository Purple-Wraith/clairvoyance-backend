name: Scheduled Data Refresh

on:
  schedule:
    # ~09:00 MT = 15:00 UTC (MDT) / 16:00 UTC (MST). Minute nudged off :00
    # 2026-09-09 -- GitHub's own scheduler (and widely-reported multi-hour
    # community delays) clusters hardest at the top of the hour; this repo
    # already proved the fix works for Auto Lock + Settle's own crons.
    - cron: '13 15 * * *'
    # ~15:00 MT = 21:00 UTC (MDT) / 22:00 UTC (MST)
    - cron: '13 21 * * *'
    # ~23:00 MT = 05:00 UTC next day (MDT) / 06:00 UTC (MST)
    - cron: '13 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # the publish step dispatches pages-deploy.yml

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 lxml playwright
          for i in 1 2 3; do playwright install chromium --with-deps 2>/dev/null && break; echo "Playwright install attempt $i failed -- retrying in 20s..."; sleep 20; done || true

      - name: Run Clairvoyance update v7.0
        env:
          # ODDS_API_KEY removed 2026-10-03: the key returns 401 (free tier = 500 credits/month, this job used ~20 per run x 3 runs/day), and its only consumer
          # (a redundant odds backfill + an unused futures panel) is covered by ESPN / Flashscore prices; clairvoyance_update.py falls back to ESPN odds when it is unset.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: America/Denver
        run: |
          python scripts/clairvoyance_update.py --no-linemate
        # Soccer's per-team fetches (season stats, prior-season blend,
        # 2-season match log) grew from 1 ESPN call/team to up to 4 this
        # session -- a recent real run measured 573s (9.5 min) of this
        # step's 900s budget, only ~5.5 min of headroom left before a
        # slow API day silently truncates whichever sports haven't been
        # reached yet. Bumped from 15 to 25 min for real margin.
        timeout-minutes: 25

      - name: Commit and push data
        id: push
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          # never commit a half-written/corrupt JSON: it would be served to every device and read by every lock pass
          for f in docs/data.json docs/live_data.json docs/social_copy.json docs/soccer_fbref.json docs/mls_stats.json docs/mls_schedule.json; do
            if [ -f "$f" ] && ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "::error::$f is not valid JSON -- refusing to commit it"
              exit 1
            fi
          done
          git add docs/data.json docs/live_data.json docs/social_copy.json docs/soccer_fbref.json docs/mls_stats.json docs/mls_schedule.json data/ || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "auto-refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              # One fetch+rebase retry before alerting -- same pattern
              # every other marker/state-commit step in this repo now
              # uses, since this repo gets pushed to from many concurrent
              # scheduled workflows and a plain push failing once is
              # usually just that, not a real problem worth paging on.
              #
              # 2026-10-03: the update script also rewrites files this step never stages (card.png, bet_history.csv, version.json), and `git rebase`
              # refuses a dirty tree ("cannot rebase: You have unstaged changes") -- that killed the retry in 3 of the last 14 runs while the run still
              # reported SUCCESS, leaving data.json hours stale. Park those byproducts first (they are regenerated every run, nothing needs them kept).
              git stash --include-untracked -q || true
              # 2026-10-03: up to 4 fetch+rebase+push attempts with a short backoff (the lock slots and fetch workflows push to main constantly; a single retry lost the race
              # often enough to leave data.json hours stale). `-X theirs` during a rebase means THIS run's side wins -- the full refresh regenerates every key, so its
              # data.json is the complete one (the lock slots also commit docs/data.json after refreshing their NHL pieces, which is the file that can conflict).
              pushed=false
              for attempt in 1 2 3 4; do
                git fetch origin main
                if git rebase -X theirs origin/main && git push; then
                  pushed=true
                  break
                fi
                git rebase --abort 2>/dev/null || true
                echo "Push attempt $attempt failed -- retrying"
                sleep $((attempt * 8))
              done
              if [ "$pushed" = "true" ]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "push_failed=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Alert on push failure
        if: steps.push.outputs.push_failed == 'true'
        # Fail the run (it used to only echo an annotation, so a dropped push still showed green): a stale data.json feeds every sim and every lock pass.
        run: |
          echo "::error::Scheduled refresh's git push to main failed -- docs/data.json on main is NOT updated."
          exit 1

      # 2026-10-10: the commit/push above keeps its own stash + `rebase -X theirs` recovery (it regenerates data.json in full). The shared publish step then only has to
      # dispatch pages-deploy.yml (nothing left to commit) and mirror live_data.json to R2 (a no-op until the R2 secrets exist). It runs BEFORE the verification below so that
      # the deploy is already on its way while the verification polls.
      - name: Publish (deploy Pages + R2 mirror)
        if: steps.push.outputs.changed == 'true'
        uses: ./.github/actions/publish
        with:
          r2-files: docs/live_data.json
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}

      # Post-deploy verification: same safety net as the local git_push() path
      # (verify_deployment() in clairvoyance_update.py) — GitHub Pages needs a
      # short moment to rebuild after the push above, then the live data.json
      # is polled to confirm it actually loads and has real content, not just
      # that the commit succeeded.
      - name: Verify deployment
        if: steps.push.outputs.changed == 'true'
        run: |
          ok=false
          for i in 1 2 3; do
            sleep 25
            if curl -sf "https://purple-wraith.github.io/clairvoyance-backend/data.json?_v=$(date +%s)" -o /tmp/live_data.json; then
              if python3 -c "import json,sys; d=json.load(open('/tmp/live_data.json')); games=len(d.get('nba',{}).get('today',[]))+len(d.get('nhl',{}).get('today',[]))+len(d.get('pwhl',{}).get('today',[])); bets=len(d.get('bestBets',[]))+len(d.get('heroPicksForDay',[])); sys.exit(0 if d.get('generated') and (games>0 or bets>0) else 1)"; then
                ok=true
                break
              fi
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "::warning::Live data.json failed post-deploy verification"
          fi
