name: Send Demo Locks Emails

# One-off/manual: sends a demo locks email for each of the 5 sport
# products using realistic synthetic sample picks (scripts/send_demo_emails.py),
# not live game data -- useful for previewing the email format/brand
# header regardless of which leagues are actually in-season today.
# No Playwright needed (unlike auto-lock-settle.yml) since this never
# touches the live app or Supabase, just sends email.
#
# Real bug, found auditing this workflow 2026-10-02 (confirmed via a
# real triggered run failing outright): this had NO dependency-install
# step at all, and send_demo_emails.py imports send_locks_email/
# PRODUCT_LABEL from auto_lock_settle.py, which does a module-level
# `import requests` -- added 2026-08-26 (commit ae9aa127), after this
# workflow was created and after its last real successful run
# (2026-08-24). Every run since has died immediately with
# "ModuleNotFoundError: No module named 'requests'" -- this workflow has
# been completely broken, silently, for over 5 weeks, because nobody
# had triggered it since the import was added. requests is the only
# missing piece -- auto_lock_settle.py's `from playwright.sync_api import
# sync_playwright` is a lazy import inside main(), never reached by this
# script's own call path, so Playwright genuinely isn't needed here.
on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient email (blank = LOCKS_EMAIL_TO/SOCIAL_CARD_EMAIL_TO secret)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  send-demo-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      - name: Send demo emails
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/send_demo_emails.py ${{ inputs.to != '' && format('--to {0}', inputs.to) || '' }}
