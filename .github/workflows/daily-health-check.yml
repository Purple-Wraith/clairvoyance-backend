name: Daily Health Check

# Durable replacement for the old session-only "did the daily jobs
# actually run" check -- this used to depend on a person remembering to
# look. Runs once a day, checks every other scheduled workflow in this
# repo for a missing or failed run, and only emails if it finds something
# wrong (silent on a healthy day, matching hands-off preference).
on:
  schedule:
    # ~11:15 MT (17:15 UTC) -- an early pass whose only real job is
    # check_lock_markers() (see daily_health_check.py): by this time
    # soccer's 8am cutoff and CFB's 11am cutoff have both passed, so a
    # genuine miss that morning gets flagged same-day instead of waiting
    # for the 14:30 pass below. GITHUB_TOKEN-based workflow-run checks
    # still run too (harmless this early -- MONITORED's 26h window means
    # they won't have anything meaningful to say yet, so this is really
    # just the marker check arriving early).
    - cron: '15 17 * * *'
    # ~14:30 MT (20:30 UTC) -- the full daily pass, after every job it
    # checks has had its chance to run for the day, in the same open
    # 17:00-21:00 UTC gap other lightweight non-Playwright jobs in this
    # repo use.
    # Minute nudged off :30 2026-09-09 (account-wide congestion cleanup).
    - cron: '33 20 * * *'
    # ~17:15 MT in summer (23:15 UTC; 16:15 MT after DST ends) -- the late pass, markers only: the PM pick-of-day slate's cutoff is
    # 16:00 MT, after both passes above, so its marker was never evaluated same-day before this existed.
    - cron: '15 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write      # only to commit data/health_alert_state.json (once-a-day alert dedupe)
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
        run: |
          case "${{ github.event.schedule }}" in
            "15 17 * * *") PASS=early ;;
            "15 23 * * *") PASS=late ;;
            *) PASS=full ;;
          esac
          python3 scripts/daily_health_check.py --pass "$PASS"

      # Records which problems were already emailed today so the next pass does not repeat them (see daily_health_check._report).
      - name: Commit alert state
        if: ${{ always() }}
        run: |
          git add data/health_alert_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: health alert state"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::health alert state: push failed after rebase (next pass may repeat today's alert)"
              else
                git rebase --abort
                echo "::warning::health alert state: rebase conflict, skipped"
              fi
            fi
          fi
