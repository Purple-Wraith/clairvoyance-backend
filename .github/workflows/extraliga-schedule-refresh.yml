name: Extraliga Schedule + Standings Refresh

# New league, explicit request 2026-09-22/23, same session/pattern as
# Liiga/SHL/NLA (see liiga-schedule-refresh.yml's own comment for the
# full rationale: no ESPN coverage, needs Playwright since Flashscore is
# a JS-rendered SPA, kept as its own workflow rather than folded into
# the lightweight `pip install requests`-only daily-schedules-refresh.yml).

on:
  schedule:
    # 6:25 AM MT = 12:25 UTC (MDT) / 13:25 UTC (MST) -- 5 minutes after
    # NLA's own refresh, same runner-contention stagger reasoning used
    # throughout this repo's Playwright-heavy schedule refreshes.
    - cron: '25 12 * * *'
    # 3:15 PM MT = 21:15 UTC (MDT) -- second daily refresh, same
    # reasoning as Liiga/SHL/NLA's own second refresh: fetch_extraliga.py's
    # scraper also only recognizes "pre"/"post", no in-progress state, so
    # a single morning refresh would leave same-day final scores stale
    # until the next morning's run.
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-extraliga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -q playwright
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Refresh Extraliga schedule/standings and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_extraliga.py --push
