name: CFB Auto Lock (Early)

# Dedicated early lock+email pass for just CFB -- confirmed real kickoff
# times of 10:00 AM MT and later (per the user directly), which the main
# auto-lock-settle.yml run (10:15 AM MT) would already be cutting it
# close on, or missing outright for the earliest games. Same idea as
# soccer-lock-early.yml, one sport at a time.
#
# Same safety convention as the other lock workflows: dry-run by
# default, reads the same LIVE_MODE repo variable (Settings -> Secrets
# and variables -> Actions -> Variables) so this goes live/dry-run
# together with the rest, not independently.

on:
  schedule:
    # 9:00 AM MT = 15:00 UTC (MDT) / 16:00 UTC (MST) -- an hour ahead of
    # the earliest confirmed CFB kickoffs.
    - cron: '0 15 * * *'
    # 3 catch-up slots, 20 min apart. Real GitHub Actions scheduling
    # unreliability (same class already found and fixed for the main
    # lock workflow -- confirmed live 2026-08-29: BOTH the 9:00 and the
    # single 9:20 catch-up that used to be here failed to fire at all,
    # not just late -- a single extra slot wasn't enough headroom against
    # how often this platform drops a given scheduled trigger entirely).
    # Each one only actually runs the lock pass if today's real lock
    # hasn't already succeeded (see the should_run check below, which
    # treats the FIRST slot above as the only unconditional one and
    # every other cron entry as a catch-up needing the marker check) --
    # still all ahead of the earliest confirmed 10:00am kickoffs.
    - cron: '20 15 * * *'
    - cron: '40 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually write to Supabase (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cfb-lock-early:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Determine live flag from trigger
        id: flags
        run: |
          # Scheduled runs now honor LIVE_MODE directly, same as
          # workflow_dispatch -- the one-week dry-run gate that held
          # scheduled runs to dry-run through 2026-08-29 regardless of
          # LIVE_MODE has been removed (monitoring period judged
          # sufficient; explicitly requested to go live immediately
          # rather than waiting for 2026-08-30).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            # The first slot (9:00am) always runs unconditionally; every
            # other cron entry above is a catch-up that only runs if
            # today's real lock hasn't already succeeded -- this way
            # adding/removing catch-up slots never needs a matching
            # change here, just the schedule list above.
            if [ "${{ github.event.schedule }}" != "0 15 * * *" ]; then
              TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
              LAST_CFB_LOCK=$(cat data/last_cfb_lock_date.txt 2>/dev/null || echo "")
              if [ "$LAST_CFB_LOCK" = "$TODAY_MT" ]; then
                echo "should_run=0" >> "$GITHUB_OUTPUT"
              else
                echo "should_run=1" >> "$GITHUB_OUTPUT"
                echo "::notice::CFB lock hasn't recorded success yet today -- running this catch-up slot (schedule=${{ github.event.schedule }})."
              fi
            else
              echo "should_run=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run CFB-only auto-lock
        if: ${{ steps.flags.outputs.should_run == '1' }}
        env:
          TZ: America/Denver
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/auto_lock_settle.py --lock --only-cfb ${{ steps.flags.outputs.live_flag }}

      - name: Record successful CFB lock date
        # Only after a run that actually included a LIVE lock pass -- a
        # dry-run must never mark today as locked, or the 9:20 catch-up
        # would wrongly skip itself.
        if: ${{ steps.flags.outputs.should_run == '1' && steps.flags.outputs.live_flag == '--live' }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_cfb_lock_date.txt
          git add data/last_cfb_lock_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record CFB early lock for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi
