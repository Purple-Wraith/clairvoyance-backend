name: Landing Page Performance Refresh

# docs/engine_performance.json, docs/engine_performance_subscriber.json,
# and docs/sport_performance.json (the ONLY data source
# clairvoyanceengine.info's Live Track Record / Sport Performance sections
# read -- a separate repo, clairvoyance-landing, fetches these files
# directly from this repo's GitHub Pages) used to refresh only once a day,
# as a side effect of social-cards-daily.yml's full run (cards + video +
# email) at ~9:52am MT. That's fine for YESTERDAY/THIS MONTH/LAST MONTH/
# ALL TIME (they don't change intraday anyway), but TODAY's figures would
# sit frozen at whatever they were around 10am MT for the rest of the day,
# growing more stale and misleading as more games actually settle --
# directly against the explicit "update every few hours" ask this exists
# to satisfy.
#
# engine_performance_subscriber.json (added 2026-09-03): same periods as
# engine_performance.json, but filtered to only the 5 real paid-product
# sports (nfl/cfb/nba/nhl/soccer -- was 6 with mlb until it was retired
# from the engine entirely 2026-09-08) -- explicit request that the
# public Live Track Record section not include personal-use-only
# WNBA/tennis/etc performance. The landing page's Live Track Record
# section fetches this one now; engine_performance.json (the full,
# unfiltered ledger) stays published too, just unused by that section
# currently.
#
# Runs generate_social_cards.py --json-only (added alongside this
# workflow): reuses the exact same browser-launch + Supabase-load +
# snapshot logic the full daily run already uses, but stops right after
# writing the JSON files -- no card/video generation, no email, no
# --force date-gate concerns. A fast, cheap, non-Playwright-heavy-in-the-
# sense-that-matters job (~15s of real work) safe to run several times a
# day without the queue-starvation risk documented on the heavier daily
# jobs in this repo.

on:
  schedule:
    # Hourly, 9am-9pm MT (13 runs/day) -- explicit request to tighten
    # from the original every-3-hours. Same active-betting-day window as
    # before, just finer-grained. 9am MT = 15:00 UTC (MDT), hence the UTC
    # hour ranges below (15-23 covers 9am-5pm MT same calendar day, 0-3
    # covers 6pm-9pm MT which is already past midnight UTC); drifts ~1hr
    # earlier MT once MST returns in November, same as every other
    # fixed-UTC cron in this repo. :37 rather than :00 to avoid landing
    # on the same minute as other scheduled workflows in this repo.
    - cron: '37 15-23,0-3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-landing-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          playwright install --with-deps chromium

      - name: Refresh performance JSON snapshots
        run: python3 scripts/generate_social_cards.py --json-only

      - name: Commit and push
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/engine_performance.json docs/engine_performance_subscriber.json docs/sport_performance.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "landing-perf: refresh $(TZ=America/Denver date +%H:%M) MT"
            if ! git push origin main; then
              git fetch origin main
              if git rebase origin/main; then
                git push origin main || echo "::warning::landing-perf: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::landing-perf: rebase conflict, skipped this update, will retry next run"
              fi
            fi
          fi
