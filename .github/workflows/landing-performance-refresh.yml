name: Landing Page Performance Refresh (manual)

# docs/engine_performance.json, docs/engine_performance_subscriber.json,
# and docs/sport_performance.json (the ONLY data source
# clairvoyanceengine.info's Live Track Record / Sport Performance sections
# read -- a separate repo, clairvoyance-landing, fetches these files
# directly from this repo's GitHub Pages) used to refresh only once a day,
# as a side effect of social-cards-daily.yml's full run (cards + video +
# email) at ~9:52am MT. That's fine for YESTERDAY/THIS MONTH/LAST MONTH/
# ALL TIME (they don't change intraday anyway), but TODAY's figures would
# sit frozen at whatever they were around 10am MT for the rest of the day,
# growing more stale and misleading as more games actually settle --
# directly against the explicit "update every few hours" ask this exists
# to satisfy.
#
# STANDALONE SCHEDULE REMOVED 2026-09-12: this used to carry its own
# hourly cron (9am-9pm MT, 13 nominal runs/day), but a real audit of 12
# days of run history found it only actually fired ~4-5x/day, with an
# identical ~12-14hr overnight dead zone every single day -- GitHub
# Actions silently drops most ticks of a frequent standalone cron once a
# repo already runs this many other scheduled workflows, rather than
# queuing or delaying them. The JSON refresh (same generate_social_cards.py
# --json-only call, see below) now instead rides along as an extra step
# on every real invocation of auto-lock-settle.yml, which already fires
# ~10x/day with actual overnight coverage -- far more reliable than this
# workflow's own schedule ever was, at zero added scheduled-workflow
# contention. This file is kept ONLY for an on-demand manual refresh
# (workflow_dispatch) -- e.g. to force an immediate update without
# waiting for auto-lock-settle.yml's next real run.
#
# engine_performance_subscriber.json (added 2026-09-03): same periods as
# engine_performance.json, but filtered to only the 5 real paid-product
# sports (nfl/cfb/nba/nhl/soccer -- was 6 with mlb until it was retired
# from the engine entirely 2026-09-08) -- explicit request that the
# public Live Track Record section not include personal-use-only
# WNBA/tennis/etc performance. The landing page's Live Track Record
# section fetches this one now; engine_performance.json (the full,
# unfiltered ledger) stays published too, just unused by that section
# currently.
#
# Runs generate_social_cards.py --json-only: reuses the exact same
# browser-launch + Supabase-load + snapshot logic the full daily run
# already uses, but stops right after writing the JSON files -- no
# card/video generation, no email, no --force date-gate concerns.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-landing-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Refresh performance JSON snapshots
        run: python3 scripts/generate_social_cards.py --json-only

      - name: Commit and push
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/engine_performance.json docs/engine_performance_subscriber.json docs/sport_performance.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "landing-perf: refresh $(TZ=America/Denver date +%H:%M) MT"
            if ! git push origin main; then
              git fetch origin main
              if git rebase origin/main; then
                git push origin main || echo "::warning::landing-perf: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::landing-perf: rebase conflict, skipped this update, will retry next run"
              fi
            fi
          fi
