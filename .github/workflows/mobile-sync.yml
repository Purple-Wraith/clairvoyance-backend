name: Sync to Mobile Repo

on:
  push:
    branches: [main]
    # Everything under docs/ (every data file the app fetches, not just a hand-picked list) plus the scripts that build the mobile copy.
    paths:
      - 'docs/**'
      - 'scripts/mobile_transform.py'
      - 'scripts/mobile_sync.py'
      - '.github/workflows/mobile-sync.yml'
  workflow_dispatch: {}
  # Data refreshes push with the default GITHUB_TOKEN, and GitHub never lets such a push trigger the `push` trigger above -- so the mobile site silently stopped updating whenever
  # the only change was a bot commit (found 2026-10-06: mobile data.json was ~4 h behind). workflow_run is exempt from that rule; this is the SAME list as pages-deploy.yml
  # (scripts/test_workflow_refs.py keeps them equal and checks every name is a real workflow).
  workflow_run:
    types: [completed]
    workflows:
      - "CFB Roster Refresh"
      - "CFB Stats + Rankings Refresh"
      - "NFL Weekly Refresh (stats, standings, player stats; roster every 2 weeks)"
      - "Soccer Refresh (Tomorrow Schedule + Opta Stats)"
      - "European Hockey Schedule + Standings Refresh"
      - "Manual Data Sync"
      - "Scheduled Data Refresh"
      - "Daily Social Cards Email"
      - "Auto Lock + Settle"
      - "CFB Auto Lock (Early)"
      - "CFB Auto Lock (Evening — Tomorrow's Slate)"
      - "European Lock (Early)"
      - "Soccer Auto Lock (Evening — Tomorrow's Slate)"
      - "SHL/Liiga Auto Lock (Evening — Tomorrow's Slate)"
      - "Landing Page Performance Refresh (manual)"
      - "Live Score Tracker"
      - "Daily Schedules + Standings Refresh"
      - "Daily Player & Prop Stats Refresh"
  schedule:
    - cron: '17 */2 * * *'      # fallback: a no-op when nothing changed

# A live-score service pushes docs/live_data.json every ~3min, and each
# push here re-triggers this workflow -- on a busy day (e.g. a burst of
# manual commits landing close together) that's enough concurrent runs to
# exhaust the account's available runner slots, and everything past the
# first gets cancelled with no runner ever assigned (confirmed via the
# Actions API: runner_id 0 on the cancelled runs). Since only the LATEST
# push's state is ever meaningful to sync, cancelling an in-flight run
# when a newer one arrives is correct behavior here, not data loss --
# collapses a burst of N pushes into one real sync instead of N racing
# runs.
concurrency:
  group: mobile-sync
  cancel-in-progress: true

jobs:
  sync-mobile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout clairvoyance-backend (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Clone Clairvoyance-backend-mobile
        run: |
          git config --global user.email "mobile-sync@clairvoyanceengine.info"
          git config --global user.name "Clairvoyance Mobile Sync"
          git clone https://MercMink21:${{ secrets.MOBILE_SYNC_TOKEN }}@github.com/Purple-Wraith/Clairvoyance-backend-mobile.git mobile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # COMPLETE mirror of docs/ (scripts/mobile_sync.py): every file byte-for-byte except app.html/index.html (transformed for mobile) and CNAME (never copied); files removed from the
      # backend are removed here too. Before 2026-10-06 only 8 files were copied and the mobile site 404'd on ~64 of the data files the app fetches (schedules, ledger backup, engine performance...).
      - name: Mirror docs/ into the mobile repo and apply the mobile transform
        run: python3 source/scripts/mobile_sync.py source mobile

      - name: Commit and push to mobile repo
        run: |
          cd mobile
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to push to mobile repo"
          else
            COMMIT_MSG=$(cd ../source && git log -1 --pretty=format:"%s")
            git commit -m "mobile-sync: ${COMMIT_MSG}"
            if git push origin main; then
              echo "Pushed to Clairvoyance-backend-mobile"
            else
              # Same fetch+rebase-then-abort-on-conflict fallback every
              # other marker/state-commit step in this repo now uses --
              # this pushes to a separate mobile repo so collisions are
              # rarer (only this workflow writes to it), but two runs
              # overlapping (manual dispatch + schedule) is still real.
              git fetch origin main
              if git rebase origin/main; then
                git push origin main && echo "Pushed to Clairvoyance-backend-mobile" || echo "::warning::mobile-sync: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::mobile-sync: rebase conflict, skipped this sync, will retry next run"
              fi
            fi
          fi
