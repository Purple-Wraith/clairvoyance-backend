name: Soccer Auto Lock (Early)

# Dedicated early-morning lock+email pass for all 6 soccer leagues --
# Champions League, Premier League, La Liga, Bundesliga, Serie A, AND MLS.
# One combined "soccer" product email, with legs grouped into an EUROPE
# section and a NORTH AMERICA (MLS) section (see build_locks_email_html's
# soccer_split) so the two regions stay visually distinct in a single
# email rather than reading as six same-weight league sections.
#
# MLS used to be deliberately excluded here (kicks off at normal US
# evening times, has none of the early-kickoff problem this exists for)
# and was left to the main 10:15 AM MT lock run instead -- split across
# two emails. Folded back in on request so a soccer subscriber gets one
# email covering the whole product. auto_lock_settle.py's lockPick() calls
# are idempotent (a leg already locked here just reports "dup-or-failed"
# when the main run's own full pass reaches it later), so MLS being
# covered by both this run and the main run is harmless, not a double-lock
# risk -- this run just gets first crack at whatever's already on the
# board by 6:20 AM MT.
#
# auto-lock-settle.yml's main run is too late for the 5 European leagues:
# confirmed real kickoff times as early as 7:00 AM MT (EPL), 9:00 AM MT
# (La Liga), 10:30 AM MT (Serie A) on a normal matchday. Once live, the
# main run would find those games already in progress or finished.
#
# This costs little real accuracy for soccer specifically: the pipeline's
# own soccer data (Opta stats run 5:00 AM MT, standings 6:00 AM MT --
# see daily-schedules-refresh.yml) is already about as fresh as it will
# get before a 7:00 AM kickoff regardless of what time this fires, so
# moving the lock earlier doesn't mean locking on staler data than the
# 10:15 AM run would have used anyway.
#
# Same safety convention as auto-lock-settle.yml: dry-run by default,
# reads the same LIVE_MODE repo variable (Settings -> Secrets and
# variables -> Actions -> Variables) so both workflows go live/dry-run
# together, not independently.

on:
  schedule:
    # 6:00 AM MT = 12:00 UTC (MDT) / 13:00 UTC (MST) -- per explicit
    # request, shifted from 6:20 to exactly 6:00 for a full hour ahead of
    # the earliest 7:00 AM MT kickoffs. Trade-off worth knowing: this now
    # lands right AT (not after) the 6:00 AM standings refresh in
    # daily-schedules-refresh.yml, so on a slow refresh this could
    # occasionally lock on standings data that's a few minutes stale --
    # not a correctness bug, just marginally less fresh than the old
    # 6:20 timing guaranteed.
    - cron: '0 12 * * *'
    # 3 catch-up slots, 15 min apart -- same self-healing pattern already
    # proven on the main lock workflow and CFB's early lock. Confirmed
    # live 2026-08-29: this workflow's own 6:00am slot didn't fire until
    # 9:56am MT (almost 4 hours late), by which point every Premier
    # League match that day had already kicked off or finished -- the
    # whole point of running this early. With no catch-up at all before
    # this, a dropped/delayed 6:00 slot meant the 5 European leagues
    # simply never got a real pre-kickoff lock pass that day. Each catch-
    # up only actually runs if today's real lock hasn't already
    # succeeded (see the should_run check below), and all 4 slots land
    # before the earliest confirmed 7:00am kickoffs.
    - cron: '15 12 * * *'
    - cron: '30 12 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually write to Supabase (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  soccer-lock-early:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Determine live flag from trigger
        id: flags
        run: |
          # Scheduled runs now honor LIVE_MODE directly, same as
          # workflow_dispatch -- the one-week dry-run gate that held
          # scheduled runs to dry-run through 2026-08-29 regardless of
          # LIVE_MODE has been removed (monitoring period judged
          # sufficient; explicitly requested to go live immediately
          # rather than waiting for 2026-08-30).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            # The first slot (6:00am) always runs unconditionally; every
            # other cron entry above is a catch-up that only runs if
            # today's real lock hasn't already succeeded -- same pattern
            # as cfb-lock-early.yml, so adding/removing catch-up slots
            # never needs a matching change here, just the schedule list.
            if [ "${{ github.event.schedule }}" != "0 12 * * *" ]; then
              TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
              LAST_SOCCER_LOCK=$(cat data/last_soccer_lock_date.txt 2>/dev/null || echo "")
              if [ "$LAST_SOCCER_LOCK" = "$TODAY_MT" ]; then
                echo "should_run=0" >> "$GITHUB_OUTPUT"
              else
                echo "should_run=1" >> "$GITHUB_OUTPUT"
                echo "::notice::Soccer early lock hasn't recorded success yet today -- running this catch-up slot (schedule=${{ github.event.schedule }})."
              fi
            else
              echo "should_run=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run soccer-only auto-lock
        if: ${{ steps.flags.outputs.should_run == '1' }}
        env:
          TZ: America/Denver
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/auto_lock_settle.py --lock --only-soccer ${{ steps.flags.outputs.live_flag }}

      - name: Record successful soccer lock date
        # Only after a run that actually included a LIVE lock pass -- a
        # dry-run must never mark today as locked, or the catch-up slots
        # would wrongly skip themselves.
        if: ${{ steps.flags.outputs.should_run == '1' && steps.flags.outputs.live_flag == '--live' }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_soccer_lock_date.txt
          git add data/last_soccer_lock_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record soccer early lock for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi
