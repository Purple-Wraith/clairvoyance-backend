name: Live Score Tracker

# Migrates live_tracker.py from a local launchd daemon (45s continuous
# polling, requires the Mac to be on) to GitHub Actions.
#
# Real finding, not yet fully root-caused: the original */5 schedule was
# confirmed to fire far less often than every 5 minutes in practice --
# only ~2-3 real runs across a full 14-hour active window, instead of
# the ~168 a true 5-min cadence would produce. This isn't simple delay
# (GitHub's own documented behavior for high-load periods); it looks
# like GitHub Actions deprioritizing/dropping a high-frequency schedule
# outright, possibly compounded by this repo's overall scheduled-trigger
# volume across ~15 other workflow files. Widened to every 15 min as a
# best-effort mitigation -- CONFIRMED not a fix: a 2026-09-02 audit of
# subscriber-email delivery (auto-lock-settle.yml's --final-lock-check
# run, the one that actually emails) found the same problem still very
# much alive with the 15-min interval in place -- real sends landing
# 1.5 to 10 hours after their 13:35 UTC target across 5 straight days
# checked, with gh run logs confirming github.event.schedule correctly
# reported the intended cron string each time (so it's not that the
# trigger fired wrong -- the runner itself just didn't start for
# hours). This one workflow alone was firing ~72 times/day (every 15
# min, 18hrs/day) -- almost certainly the single largest contributor to
# this account's total daily scheduled-trigger volume, which is the
# more likely lever against GitHub's own account-wide throttling of
# high-volume free-tier scheduling (documented by GitHub itself) than
# any single cron's own minute offset. Widened again to every 30 min
# (~36 runs/day) on that evidence -- still checks every watchdog hour
# below at least twice, and live-score staleness of up to 30 min is a
# small cost against the multi-hour delays actually being observed
# elsewhere in the account right now. If email delivery delay persists
# at this interval too, the volume-reduction theory itself needs
# revisiting, not just another interval widening.
#
# Also replaces run_update.sh's own --mode live cron entry (retired from
# the local crontab) rather than running both: that entry's
# run_live_window() computed nearly identical live-score/win-probability
# data to the SAME docs/live_data.json file via a completely separate,
# redundant 120s-interval local process -- two writers racing on one
# file for no real benefit. live_tracker.py is the more complete of the
# two (also writes frontend/live_data.json), so it's the one that
# survives.

on:
  schedule:
    # Every 30 min, 6am-11pm MT -- widened from 9am-11pm (matching
    # live_tracker.py's own default game-window gate, 11am-1am ET) to
    # also cover CFB/soccer's early-lock windows for the watchdog step
    # below. Live-score polling itself still no-ops harmlessly for the
    # 6-9am slots if live_tracker.py's own gate says nothing's live yet.
    # 6am MT = 12:00 UTC, 11pm MT = 05:00 UTC next day (MDT), hence the
    # split hour range. Like every other fixed-UTC cron in this repo,
    # drifts ~1hr earlier MT once MST returns in November.
    # Minute nudged off :00/:30 2026-09-09 -- part of an account-wide pass
    # moving every remaining round-minute cron off the top/half of the
    # hour, since that's documented (both by GitHub itself and multiple
    # community reports) as the most congested instant for the scheduler.
    - cron: '7,37 12-23,0-5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  live-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      # Watchdog: CFB/soccer's own dedicated early-lock workflows each
      # have their own catch-up cron slots, but confirmed live 2026-08-29
      # that GitHub Actions can drop EVERY one of a workflow's own
      # scheduled triggers for a given day, not just delay them (CFB's
      # 4 slots that morning: zero fired). This runs on live-tracker's
      # own, independent 15-min schedule instead -- a different cron
      # expression is a genuinely separate chance for GitHub to actually
      # fire it, not just another slot on the same workflow that could
      # get dropped the same way. Only actually dispatches when the
      # marker file shows today's real lock hasn't succeeded yet, so a
      # normal day where the dedicated workflow fires on its own triggers
      # this to do nothing on every tick.
      - name: Watchdog -- dispatch CFB/soccer lock if overdue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: America/Denver
        run: |
          HOUR_MT=$(date +%H)
          TODAY_MT=$(date +%Y-%m-%d)
          # Soccer window: 6:00-7:45am MT, ahead of the earliest 7:00am
          # EPL kickoffs (matches soccer-lock-early.yml's own 6:00-6:45
          # catch-up range, plus one extra tick of headroom).
          if [ "$HOUR_MT" = "06" ] || [ "$HOUR_MT" = "07" ]; then
            LAST_SOCCER=$(cat data/last_soccer_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST_SOCCER" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: soccer lock not recorded for $TODAY_MT yet at ${HOUR_MT}:xx MT -- dispatching Soccer Auto Lock (Early)."
              gh workflow run "Soccer Auto Lock (Early)" -f live=true || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi
          # CFB window: 9:00-10:45am MT, ahead of the earliest confirmed
          # 10:00am kickoffs (matches cfb-lock-early.yml's own 9:00-10:00
          # catch-up range, plus one extra tick of headroom).
          if [ "$HOUR_MT" = "09" ] || [ "$HOUR_MT" = "10" ]; then
            LAST_CFB=$(cat data/last_cfb_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST_CFB" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: CFB lock not recorded for $TODAY_MT yet at ${HOUR_MT}:xx MT -- dispatching CFB Auto Lock (Early)."
              gh workflow run "CFB Auto Lock (Early)" -f live=true || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi
          # Soccer evening-lock's DATA FEED: soccer-schedule-tomorrow.yml
          # has no catch-up slots of its own (single cron trigger), unlike
          # every lock workflow it feeds -- confirmed live 2026-08-29/30
          # that a brand-new workflow's very first scheduled trigger can
          # simply not fire at all (soccer-lock-evening.yml's own 4 slots
          # that night: zero fired either, same root cause). Checks the
          # snapshot's own `date` field rather than a separate marker
          # file, since the snapshot IS the thing that needs to be fresh.
          if [ "$HOUR_MT" = "22" ]; then
            TOMORROW_ESPN=$(date -d tomorrow +%Y%m%d)
            SNAPSHOT_DATE=$(python3 -c "import json; print(json.load(open('docs/soccer_schedule_tomorrow.json')).get('date',''))" 2>/dev/null || echo "")
            if [ "$SNAPSHOT_DATE" != "$TOMORROW_ESPN" ]; then
              echo "::notice::Watchdog: soccer_schedule_tomorrow.json not refreshed for $TOMORROW_ESPN yet at ${HOUR_MT}:xx MT (has '$SNAPSHOT_DATE') -- dispatching Soccer Schedule Refresh (Tomorrow)."
              gh workflow run "Soccer Schedule Refresh (Tomorrow)" || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi
          # Soccer evening-lock window: 10:00-11:45pm MT, matching
          # soccer-lock-evening.yml's own 10:00-11:00pm catch-up range
          # plus headroom. Marker is dated by the RUN date (tonight), not
          # the game date (tomorrow) -- see soccer-lock-evening.yml's own
          # comment on why those are deliberately different fields.
          if [ "$HOUR_MT" = "22" ] || [ "$HOUR_MT" = "23" ]; then
            LAST_SOCCER_EVE=$(cat data/last_soccer_evening_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST_SOCCER_EVE" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: soccer evening lock not recorded for $TODAY_MT yet at ${HOUR_MT}:xx MT -- dispatching Soccer Auto Lock (Evening — Tomorrow's Slate)."
              gh workflow run "Soccer Auto Lock (Evening — Tomorrow's Slate)" -f live=true || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi
          # CFB evening-lock window: 10:30-11:45pm MT, matching
          # cfb-lock-evening.yml's own 10:30-11:30pm catch-up range plus
          # headroom. Same marker-date convention as soccer's evening
          # lock above (tonight's run date, not tomorrow's game date).
          if [ "$HOUR_MT" = "22" ] || [ "$HOUR_MT" = "23" ]; then
            LAST_CFB_EVE=$(cat data/last_cfb_evening_lock_date.txt 2>/dev/null || echo "")
            if [ "$LAST_CFB_EVE" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: CFB evening lock not recorded for $TODAY_MT yet at ${HOUR_MT}:xx MT -- dispatching CFB Auto Lock (Evening — Tomorrow's Slate)."
              gh workflow run "CFB Auto Lock (Evening — Tomorrow's Slate)" -f live=true || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi
          # Landing page performance refresh: no marker file of its own --
          # checks docs/engine_performance.json's own generated_at date
          # instead, since that IS the thing that needs to be fresh.
          # Confirmed live 2026-08-30: this workflow had 0 real scheduled
          # firings ever (checked via `gh run list`) despite 3+ real
          # opportunities since it was created the prior afternoon -- the
          # same "brand-new workflow's scheduled trigger doesn't reliably
          # fire" pattern already seen with the evening locks, but here it
          # never self-healed since nothing was watching it. Checked once
          # at 1pm MT, giving the real 9am and 12pm slots time to have
          # already succeeded normally.
          if [ "$HOUR_MT" = "13" ]; then
            GEN_DATE=$(python3 -c "import json; print(json.load(open('docs/engine_performance.json')).get('generated_at','')[:10])" 2>/dev/null || echo "")
            if [ "$GEN_DATE" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: landing performance JSON not refreshed today (shows $GEN_DATE) by 1pm MT -- dispatching Landing Page Performance Refresh."
              gh workflow run "Landing Page Performance Refresh" || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi
          # Daily Schedules + Standings Refresh (CFB/NFL/soccer schedule +
          # standings) and Daily Player & Prop Stats Refresh: same "brand-
          # new workflow's first scheduled trigger can silently never fire"
          # pattern as the landing-performance case above, confirmed live
          # 2026-09-02 -- both consolidated workflows (created that
          # afternoon) had zero real scheduled runs by the next morning
          # despite real opportunities (05:10/11:55 UTC and 15:45 UTC
          # respectively), leaving CFB/NFL schedules and player/prop stats
          # ~16.5h stale with nothing watching for it. Same no-marker-file
          # approach as landing-performance: check each job's own output
          # file's generated_at, since that IS the thing that needs to be
          # fresh. Checked at 1pm MT, same as landing-performance -- well
          # after both workflows' own morning cron slots (5:55am and
          # 9:45am MT) have had a real chance to fire and catch up on
          # their own first.
          if [ "$HOUR_MT" = "13" ]; then
            CFB_SCHED_DATE=$(python3 -c "import json; print(json.load(open('docs/cfb_schedule.json')).get('generated_at','')[:10])" 2>/dev/null || echo "")
            if [ "$CFB_SCHED_DATE" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: CFB schedule JSON not refreshed today (shows $CFB_SCHED_DATE) by 1pm MT -- dispatching Daily Schedules + Standings Refresh."
              gh workflow run "Daily Schedules + Standings Refresh" || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
            # docs/player_stats.json (scrape_player_stats.py's own output,
            # the first script in this job) -- NOT docs/nfl_player_stats.json,
            # which belongs to a different, unrelated workflow (NFL Team
            # Stats + Standings Refresh) and would never reflect whether
            # THIS job ran. Caught live while verifying this exact watchdog:
            # confirmed via a real manual dispatch that docs/player_stats.json
            # updated correctly while docs/nfl_player_stats.json stayed
            # untouched, as expected once the right file was checked. Also
            # note the field name here is generatedAt (camelCase), not
            # generated_at like the other scripts checked above -- confirmed
            # against the real file, not assumed from convention.
            PSTATS_DATE=$(python3 -c "import json; print(json.load(open('docs/player_stats.json')).get('generatedAt','')[:10])" 2>/dev/null || echo "")
            if [ "$PSTATS_DATE" != "$TODAY_MT" ]; then
              echo "::notice::Watchdog: player stats JSON not refreshed today (shows $PSTATS_DATE) by 1pm MT -- dispatching Daily Player & Prop Stats Refresh."
              gh workflow run "Daily Player & Prop Stats Refresh" || echo "::warning::Watchdog dispatch failed (non-fatal, will retry next tick)"
            fi
          fi

      - name: Poll live scores
        env:
          TZ: America/Denver
        run: python3 scripts/live_tracker.py

      - name: Commit and push live data
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/live_data.json frontend/live_data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "live: $(TZ=America/Denver date +%H:%M) MT scores"
            if ! git push origin main; then
              # Same fetch+rebase+retry pattern already proven elsewhere
              # in this repo (see run_live_window's own comment on the
              # real 41-unpushed-commits incident this exact failure mode
              # caused when it silently had no retry logic at all).
              # Real failure, found via audit: a rebase conflict here had
              # no abort fallback, so it hard-failed the whole step under
              # bash -e instead of just skipping this one live-score
              # update (harmless -- the next run 30-60s later refreshes
              # the same data anyway). Same fix already applied to every
              # other marker/state-commit step in this repo that had the
              # identical gap (see auto-lock-settle.yml's "Record
              # successful lock date" step for the real incident that
              # caught this pattern).
              git fetch origin main
              if git rebase origin/main; then
                git push origin main || echo "::warning::live-tracker: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::live-tracker: rebase conflict, skipped this update, will retry next run"
              fi
            fi
          fi
