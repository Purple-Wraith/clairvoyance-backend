name: Manual Data Sync

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this sync'
        required: false
        default: 'sync-button'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 lxml playwright
          for i in 1 2 3; do playwright install chromium --with-deps 2>/dev/null && break; echo "Playwright install attempt $i failed -- retrying in 20s..."; sleep 20; done || true

      - name: Run Clairvoyance update v7.0
        env:
          # ODDS_API_KEY removed 2026-10-03: the key returns 401 (free tier = 500 credits/month, this job used ~20 per run x 3 runs/day), and its only consumer
          # (a redundant odds backfill + an unused futures panel) is covered by ESPN / Flashscore prices; clairvoyance_update.py falls back to ESPN odds when it is unset.
          TZ: America/Denver
        run: |
          python scripts/clairvoyance_update.py --no-linemate --verbose
        timeout-minutes: 15

      - name: Commit and push data
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/data.json docs/live_data.json docs/social_copy.json data/ || true
          git diff --cached --quiet || git commit -m "sync: on-demand refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"
