name: Manual Data Sync

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this sync'
        required: false
        default: 'sync-button'

permissions:
  contents: write
  actions: write      # the publish step dispatches pages-deploy.yml

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 lxml playwright
          for i in 1 2 3; do playwright install chromium --with-deps 2>/dev/null && break; echo "Playwright install attempt $i failed -- retrying in 20s..."; sleep 20; done || true

      - name: Run Clairvoyance update v7.0
        env:
          # ODDS_API_KEY removed 2026-10-03: the key returns 401 (free tier = 500 credits/month, this job used ~20 per run x 3 runs/day), and its only consumer
          # (a redundant odds backfill + an unused futures panel) is covered by ESPN / Flashscore prices; clairvoyance_update.py falls back to ESPN odds when it is unset.
          TZ: America/Denver
        run: |
          python scripts/clairvoyance_update.py --no-linemate --verbose
        timeout-minutes: 15

      - name: Publish data
        uses: ./.github/actions/publish
        with:
          paths: docs/data.json docs/live_data.json docs/social_copy.json data/
          message: 'sync: on-demand refresh {UTC_STAMP}'
          r2-files: docs/live_data.json
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
