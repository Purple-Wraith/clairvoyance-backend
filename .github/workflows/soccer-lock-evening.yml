name: Soccer Auto Lock (Evening — Tomorrow's Slate)

# Evening-prior lock for the 5 European soccer leagues only -- Champions
# League, Premier League, La Liga, Bundesliga, Serie A. Runs the NIGHT
# BEFORE those leagues' matchday and locks TOMORROW's games, instead of
# waiting for soccer-lock-early.yml's same-day 6:00 AM MT pass.
#
# Why this exists: confirmed real kickoffs as early as 7:00 AM MT (EPL)
# leave the existing 6:00 AM same-day lock as little as ~1 hour of
# buffer -- and that pass has genuinely run late enough before to miss
# kickoff entirely (see soccer-lock-early.yml's own changelog: a real
# 6:00 AM slot that didn't fire until 9:56 AM, by which point every
# Premier League match that day had already kicked off). Locking the
# evening before trades that ~1 hour buffer for ~9+ hours, so even a
# badly-delayed run still lands hours ahead of kickoff.
#
# This costs no real signal for these specific leagues: odds are already
# posted 1-2+ days ahead of kickoff for all 5 (confirmed live against the
# real ESPN API), and the model grades off team-aggregate stats (xG/Opta
# advanced stats, form, standings, H2H) -- never starting lineups, which
# aren't announced until ~1hr before kickoff regardless of what time this
# runs. A stats refresh done the evening before is no less fresh than the
# existing 6:00 AM same-day one either: none of these 5 leagues play
# overnight in Mountain Time, so a day's full set of results is already
# final by the time this runs.
#
# soccer-lock-early.yml's own 6:00 AM same-day pass is left completely
# unchanged and keeps running as today's safety net -- every leg locked
# here is stamped with the GAME's real date (tomorrow), so anything this
# pass locks tonight dedupes cleanly against that same-day pass the next
# morning (identical lockPick() id -- see run_soccer_evening_lock's own
# docstring in auto_lock_settle.py). If this evening pass fails outright
# (workflow never fires, snapshot never arrives), tomorrow's normal 6:00
# AM run still catches everything, same as before this existed.
#
# Depends on soccer-schedule-tomorrow.yml having already run (10 min
# earlier) to publish docs/soccer_schedule_tomorrow.json -- this workflow
# never fetches live odds itself.
#
# Same safety convention as every other lock workflow in this repo: dry-
# run by default, reads the same LIVE_MODE repo variable (Settings ->
# Secrets and variables -> Actions -> Variables) so every lock workflow
# goes live/dry-run together, not independently. Since this is brand-new,
# never-run-in-production code (new date-stamping path), consider
# reviewing a few nights of dry-run output specifically for THIS workflow
# before trusting LIVE_MODE=true here the same as the proven same-day
# passes -- workflow_dispatch lets you force a single live/dry run
# regardless of the variable.

on:
  schedule:
    # 10:00 PM MT = 04:00 UTC (MDT) -- 10 min after soccer-schedule-
    # tomorrow.yml's scrape. Like every other MT time in this repo, this
    # is a fixed UTC cron -- GitHub Actions doesn't shift for DST, so the
    # real landing time drifts ~1hr earlier MT once MST returns in
    # November.
    - cron: '0 4 * * *'
    # 3 catch-up slots, 20 min apart -- same self-healing pattern already
    # proven on soccer-lock-early.yml/cfb-lock-early.yml. All 4 slots
    # land well before the earliest ~7:00 AM MT kickoff the NEXT day (9+
    # hours of margin even on the last slot), so there's no equivalent
    # need for a tight afternoon/evening cutoff the way the main lock's
    # own catch-up window has.
    - cron: '20 4 * * *'
    - cron: '40 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually write to Supabase (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  soccer-lock-evening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Determine live flag from trigger
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
            # The first slot (10:00 PM) always runs unconditionally; every
            # other cron entry above is a catch-up that only runs if
            # tonight's evening lock hasn't already succeeded -- same
            # pattern as soccer-lock-early.yml/cfb-lock-early.yml. Marker
            # is dated by TONIGHT's date (the run date), not tomorrow's
            # game date -- deliberately different meaning from
            # last_soccer_lock_date.txt, which records the day its games
            # were played.
            if [ "${{ github.event.schedule }}" != "0 4 * * *" ]; then
              TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
              LAST_RUN=$(cat data/last_soccer_evening_lock_date.txt 2>/dev/null || echo "")
              if [ "$LAST_RUN" = "$TODAY_MT" ]; then
                echo "should_run=0" >> "$GITHUB_OUTPUT"
              else
                echo "should_run=1" >> "$GITHUB_OUTPUT"
                echo "::notice::Soccer evening lock hasn't recorded success yet tonight -- running this catch-up slot (schedule=${{ github.event.schedule }})."
              fi
            else
              echo "should_run=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run soccer evening-prior auto-lock
        if: ${{ steps.flags.outputs.should_run == '1' }}
        env:
          TZ: America/Denver
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/auto_lock_settle.py --lock --only-soccer-tomorrow ${{ steps.flags.outputs.live_flag }}

      - name: Record successful evening lock date
        # Only after a run that actually included a LIVE lock pass -- a
        # dry-run must never mark tonight as done, or the catch-up slots
        # would wrongly skip themselves.
        if: ${{ steps.flags.outputs.should_run == '1' && steps.flags.outputs.live_flag == '--live' }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_soccer_evening_lock_date.txt
          git add data/last_soccer_evening_lock_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record soccer evening lock for $TODAY_MT"
            if ! git push origin main; then
              git fetch origin main
              if git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" rebase origin/main; then
                git push origin main || echo "::warning::record lock: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::record lock: rebase conflict, skipped this marker write, will retry next run"
              fi
            fi
          fi
