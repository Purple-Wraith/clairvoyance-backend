name: NFL Team Stats + Standings Refresh

# User's explicit cadence request: scrape every Tuesday, right after
# Monday Night Football closes out the week, so the following week's
# stats/standings are locked in and updated before Thursday's next
# kickoff. A single Tuesday-morning run covers team stats
# (offense/defense/special-teams), standings (W-L/PF/PA/diff), and real
# per-player season stats for every active offensive skill-position
# player (for the analytical player-props model) -- all three only
# meaningfully change once a week's games are all final.
#
# player_stats fetches each team's real roster then each of those
# players' own stats individually (~500-650 requests total across the
# league, replacing an earlier team-"leaders"-only approach that never
# returned more than a handful of stars per team) -- budget real time
# for this step, especially the one-time cost early in a season when
# the current-year auto-detect comes back empty and it re-runs the
# whole league against the prior season as a fallback.

on:
  schedule:
    # ~Tuesday 7:00 AM MT = 13:00 UTC (MDT) / 14:00 UTC (MST). Minute
    # nudged off :00 2026-09-09 (account-wide congestion cleanup); offset
    # from CFB Rankings' own Tuesday :47 slot at the same hour so the two
    # don't just trade one collision for another.
    - cron: '53 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-nfl-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests
      - name: Refresh stats + standings and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_nfl.py --mode stats --push
          python3 scripts/fetch_nfl.py --mode standings --push
          python3 scripts/fetch_nfl.py --mode player_stats --push
