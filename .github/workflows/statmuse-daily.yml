name: StatMuse Insights Refresh

# Scrapes statmuse.com's per-sport pages (no public API — see
# scripts/fetch_statmuse.py's own docstring for why this is a rendered-text
# scrape rather than a DOM/API integration) twice a day so the STATMUSE
# INSIGHTS panels across the app stay current with fresh fun-facts/news/
# scores rather than a stale one-time snapshot.

on:
  schedule:
    # ~8:00 MT = 14:00 UTC (MDT) / 15:00 UTC (MST). Minute nudged off :00
    # 2026-09-09 (account-wide congestion cleanup).
    - cron: '27 14 * * *'
    # ~18:00 MT = 00:00 UTC next day (MDT) / 01:00 UTC (MST)
    - cron: '43 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-statmuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright
          playwright install chromium --with-deps

      - name: Scrape StatMuse
        run: python3 scripts/fetch_statmuse.py

      - name: Commit and push
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/statmuse_data.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "statmuse: refresh insights"
            if ! git push; then
              git fetch origin main
              if git rebase origin/main; then
                git push || echo "::warning::statmuse: push still failed after rebase, will retry next run"
              else
                git rebase --abort
                echo "::warning::statmuse: rebase conflict, skipped this state write, will retry next run"
              fi
            fi
          fi
