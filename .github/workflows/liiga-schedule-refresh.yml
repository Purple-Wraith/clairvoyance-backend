name: Liiga Schedule + Standings Refresh

# New league, explicit request 2026-09-16 (SHL to follow the same
# pattern once its own sources are confirmed). Liiga has no ESPN
# coverage -- confirmed live, hockey/fin.1 returns a plain 400 -- so
# this scrapes Flashscore instead, the sources the user supplied
# directly (see fetch_liiga.py's own module docstring for the exact
# URLs and the team-identity/name-resolution design).
#
# Kept as its OWN workflow rather than folded into
# daily-schedules-refresh.yml (which only runs `pip install requests`,
# no browser) -- Flashscore is a JS-rendered SPA, confirmed live that a
# plain request returns an empty shell with zero real match markup, so
# this needs Playwright the same way cfb-rankings-weekly.yml's own ESPN-
# WAF workaround does. Bundling a Chromium download into every run of
# the lightweight daily-schedules workflow would slow down every other
# script in it for a dependency only this one needs.

on:
  schedule:
    # 6:10 AM MT = 12:10 UTC (MDT) / 13:10 UTC (MST) -- once daily,
    # ahead of the morning lock passes; Liiga plays close to daily but a
    # single morning refresh is enough to keep the upcoming-fixtures
    # window and standings current for the day's locks.
    - cron: '10 12 * * *'
    # 3:00 PM MT = 21:00 UTC (MDT) -- second daily refresh, added
    # 2026-09-17 after a real gap: this scraper's fetch_fixtures()/
    # fetch_results() only recognize "pre" (upcoming) and "post" (final,
    # both scores present) -- no in-progress state at all. Liiga's
    # earliest games kick off ~9:30 AM MT; the single 6:10 AM refresh
    # ran hours before puck drop, so by the time auto_lock_settle.py's
    # own settle passes (10:20 AM MT / 1:20 AM MT) ran, those games were
    # either mid-game (invisible to this scraper -- off the fixtures
    # page, not yet on results) or the schedule file was simply stale
    # from that morning. Confirmed live: a full day of real games (2026-
    # 09-17) never got auto-settled, requiring manual settlement.
    # 3:00 PM MT sits comfortably after even a late-morning kickoff's
    # game has finished, so the results page has real final scores by
    # the time the file is re-scraped -- letting the next settle pass
    # (same evening or the following 1:20 AM MT run) find genuinely
    # final data instead of a stale morning snapshot.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-liiga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -q playwright
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Refresh Liiga schedule/standings and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_liiga.py --push
