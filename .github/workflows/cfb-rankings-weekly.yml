name: CFB Rankings + FPI Refresh

# AP Top 25 and FPI/Resume/Efficiencies update on ESPN's own schedule --
# rankings drop Monday/Tuesday during the season (Sunday night for the
# final regular-season poll, in-season polls Sunday evening/Monday
# morning). Runs both days to not miss whichever one ESPN actually posts
# on in a given week. FPI itself is described by ESPN as updating daily,
# but rankings are the real weekly-cadence piece here.
#
# Needs Playwright (not just requests) as of the FPI fix below --
# www.espn.com sits behind an AWS WAF JS challenge a plain requests.get
# can never solve, which had been silently writing 0 FPI/resume/
# efficiencies rows every run (masked because the CFB model falls back
# to market odds when FPI is missing -- surfaced when a match with no
# market line either, e.g. a neutral-site opener, showed no projection
# at all). See fetch_cfb.py's _fetch_fpi_view for the real fix.

on:
  schedule:
    # ~Monday 7:00 AM MT = 13:00 UTC (MDT) / 14:00 UTC (MST). Minute
    # nudged off :00 2026-09-09 (account-wide congestion cleanup).
    - cron: '47 13 * * 1'
    # ~Tuesday 7:00 AM MT = 13:00 UTC (MDT) / 14:00 UTC (MST)
    - cron: '47 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cfb-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -q requests playwright
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed (likely a transient upstream apt-mirror hash mismatch on Google's Chrome repo) -- retrying in 20s..."; sleep 20; done
      - name: Refresh rankings + FPI and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_cfb.py --mode rankings --push
