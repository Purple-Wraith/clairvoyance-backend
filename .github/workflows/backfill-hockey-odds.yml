name: Backfill Hockey Odds (one-off)

# Manually dispatched only. Scrapes REAL closing ML / O-U / puck-line prices
# from Flashscore's completed-match pages for every finished SHL/LIIGA/NLA/
# EXTRALIGA game a logged pick refers to, and commits docs/hockey_odds_backfill.json.
# Touches no pick ledger, locks nothing, emails nobody.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-scrape matches that already have odds'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -q playwright
          for i in 1 2 3; do playwright install --with-deps chromium && break; echo "Playwright install attempt $i failed -- retrying in 20s..."; sleep 20; done
      - name: Backfill real odds and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/backfill_hockey_odds.py --push ${{ inputs.force && '--force' || '' }}
