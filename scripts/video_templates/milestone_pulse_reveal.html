<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  .stage {
    width:1080px; height:1350px; position:relative;
    background:transparent;
    display:flex; flex-direction:column; align-items:center; padding-top:70px;
    overflow:hidden;
  }
  .ring {
    position:absolute; top:280px; left:50%; width:80px; height:80px;
    border:3px solid rgba(0,240,255,.8); border-radius:50%; opacity:0;
    transform:translate(-50%,-50%) scale(0);
  }
  .ring:nth-child(1) { animation: pulse 1.6s ease-out .3s forwards; }
  .ring:nth-child(2) { animation: pulse 1.6s ease-out .6s forwards; }
  .ring:nth-child(3) { animation: pulse 1.6s ease-out .9s forwards; }
  .logo {
    position:relative; font-family:'Orbitron',sans-serif; font-weight:900; font-size:52px; letter-spacing:6px;
    color:#f000ff; text-shadow:0 0 12px #f000ff,0 0 25px rgba(240,0,255,.55);
    opacity:0; animation: reveal .7s ease-out forwards;
  }
  .tag {
    position:relative; font-family:'Share Tech Mono',monospace; font-size:22px; letter-spacing:8px;
    color:#00f0ff; text-shadow:0 0 14px rgba(0,240,255,.7);
    margin-top:60px; opacity:0; animation: reveal .6s ease-out .5s forwards;
  }
  .headline {
    position:relative; font-family:'Orbitron',sans-serif; font-weight:900; font-size:70px; text-align:center;
    color:#00f0ff; text-shadow:0 0 24px #00f0ff,0 0 60px rgba(0,240,255,.7);
    margin:26px 0; opacity:0; transform:scale(.7);
    animation: pop .7s cubic-bezier(.2,1.4,.4,1) .8s forwards;
  }
  .body-text {
    position:relative; font-family:'Orbitron',sans-serif; font-weight:700; font-size:26px; color:#e6eaff;
    text-align:center; max-width:760px; line-height:1.6;
    opacity:0; animation: reveal .8s ease-out 1.5s forwards;
  }
  .footer {
    position:absolute; bottom:70px; left:0; right:0; text-align:center;
    font-family:'Share Tech Mono',monospace; font-size:19px; letter-spacing:0.5px; color:#f000ff; text-shadow:0 0 8px rgba(240,0,255,.5); white-space:nowrap;
    opacity:0; animation: reveal .7s ease-out 2.2s forwards;
  }
  @keyframes reveal { to { opacity:1; } }
  @keyframes pop { to { opacity:1; transform:scale(1); } }
  @keyframes pulse { 0%{opacity:.9; transform:translate(-50%,-50%) scale(0)} 100%{opacity:0; transform:translate(-50%,-50%) scale(9)} }
</style>
</head>
<body>
  <canvas id="bgCanvas" width="1080" height="1350" style="position:absolute;top:0;left:0;z-index:-1"></canvas>
  <script>
    // Exact same background algorithm as _cfBg() in docs/app.html (the
    // real card generator) — pixel-matched to StandardLogo.png. Drawing
    // it with canvas instead of approximating with CSS gradients avoids
    // any anti-aliasing/rendering differences between the two.
    (function(){
      var cv=document.getElementById('bgCanvas');
      var ctx=cv.getContext('2d');
      var W=1080,H=1350,cx=W/2,cy=H/2;
      ctx.fillStyle='#121212';ctx.fillRect(0,0,W,H);
      // carbon twill: the app's body background (20px tile of 4.4px graphite cells) + its two soft page glows (2026-11-17)
      var TILE=20,K=8,tc=document.createElement('canvas');tc.width=TILE*K;tc.height=TILE*K;var tx=tc.getContext('2d');
      function cells(list,col){tx.fillStyle=col;list.forEach(function(p){tx.fillRect(p[0]*K,p[1]*K,4.4*K,4.4*K);});}
      cells([[0,0],[5,0],[0,5],[15,5],[10,10],[15,10],[5,15],[10,15]],'#1E1E1E');
      cells([[10,0],[15,0],[5,5],[10,5],[0,10],[5,10],[0,15],[15,15]],'#161616');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      for(var y=0;y<H;y+=TILE){for(var x=0;x<W;x+=TILE){ctx.drawImage(tc,x,y,TILE,TILE);}}
      function soft(fx,fy,r,rgb,a){var g=ctx.createRadialGradient(W*fx,H*fy,0,W*fx,H*fy,r);
        g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
      soft(.16,.04,620,'255,255,255',.11);soft(.86,.94,560,'166,166,166',.07);
    })();
  </script>
  <div class="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="logo">CLAIRVOYANCE</div>
    <div class="tag">MILESTONE</div>
    <div class="headline" id="headline">1000 BETS TRACKED</div>
    <div class="body-text" id="body">A thousand graded picks, settled and public.</div>
    <div class="footer">clairvoyanceengine.info &nbsp;·&nbsp; X @clairvoyanceeng &nbsp;·&nbsp; IG @clairvoyanceengine</div>
  </div>
</body>
</html>
