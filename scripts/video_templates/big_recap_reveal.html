<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  .stage {
    width:1080px; height:1350px; position:relative;
    background:transparent;
    display:flex; flex-direction:column; align-items:center; padding-top:100px;
  }
  .tag {
    font-family:'Share Tech Mono',monospace; font-size:20px; letter-spacing:9px;
    color:#ffcc00; text-shadow:0 0 12px rgba(255,204,0,.6);
    opacity:0; animation: reveal .7s ease-out forwards;
  }
  .logo-wrap { position:relative; width:1000px; height:110px; margin-top:16px; }
  .logo, .logo-r, .logo-c {
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:96px; letter-spacing:6px;
    position:absolute; top:0; left:50%; transform:translateX(-50%); white-space:nowrap;
  }
  .logo { color:#f000ff; text-shadow:0 0 15px #f000ff,0 0 32px rgba(240,0,255,.55); opacity:0; animation: settle .01s linear .9s forwards; }
  .logo-r { color:#ff2090; opacity:.8; animation: glitchR .7s steps(2) forwards, hide .01s linear .9s forwards; }
  .logo-c { color:#00f0ff; opacity:.8; animation: glitchC .7s steps(2) forwards, hide .01s linear .9s forwards; }
  .range {
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:29px; letter-spacing:2px;
    color:#00f0ff; text-shadow:0 0 12px #00f0ff; margin-top:16px;
    opacity:0; animation: reveal .7s ease-out .9s forwards;
  }
  .divider {
    width:720px; height:2px; margin:48px 0;
    background:linear-gradient(90deg,transparent,rgba(255,204,0,.8),transparent);
    box-shadow:0 0 16px rgba(255,204,0,.5);
    transform:scaleX(0); animation: growLine .8s ease-out 1.3s forwards;
  }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:32px 64px; width:880px; }
  .stat {
    background:rgba(20,10,40,.5); border:1px solid rgba(240,0,255,.25); border-radius:8px;
    padding:32px; text-align:center;
    opacity:0;
  }
  .stat-val { font-family:'Orbitron',sans-serif; font-weight:900; font-size:46px; white-space:nowrap; display:inline-block; }
  .stat-lbl { font-family:'Share Tech Mono',monospace; font-size:19px; letter-spacing:3px; color:#f000ff; text-shadow:0 0 8px rgba(240,0,255,.5); margin-top:10px; }
  /* Box fades in together with its text (statIn on .stat), not before —
     an empty bordered box sitting there before any content glitched in
     read as broken, not stylistic. */
  .stat:nth-child(1) { animation: statIn .01s linear 1.7s forwards; }
  .stat:nth-child(1) .stat-val, .stat:nth-child(1) .stat-lbl { animation: statGlitch .4s steps(4) 1.7s forwards; }
  .stat:nth-child(2) { animation: statIn .01s linear 2.0s forwards; }
  .stat:nth-child(2) .stat-val, .stat:nth-child(2) .stat-lbl { animation: statGlitch .4s steps(4) 2.0s forwards; }
  .stat:nth-child(3) { animation: statIn .01s linear 2.3s forwards; }
  .stat:nth-child(3) .stat-val, .stat:nth-child(3) .stat-lbl { animation: statGlitch .4s steps(4) 2.3s forwards; }
  .stat:nth-child(4) { animation: statIn .01s linear 2.6s forwards; }
  .stat:nth-child(4) .stat-val, .stat:nth-child(4) .stat-lbl { animation: statGlitch .4s steps(4) 2.6s forwards; }
  .val-record { color:#e6eaff; }
  .val-pct { color:#00f0ff; text-shadow:0 0 14px rgba(0,240,255,.6); }
  .val-units { color:#00da88; text-shadow:0 0 14px rgba(0,218,136,.6); }
  .val-tag { color:#ffcc00; text-shadow:0 0 14px rgba(255,204,0,.6); font-size:44px; }
  .footer {
    position:absolute; bottom:74px; left:0; right:0; text-align:center;
    font-family:'Share Tech Mono',monospace; font-size:23px; letter-spacing:0.5px; color:#f000ff; text-shadow:0 0 8px rgba(240,0,255,.5); white-space:nowrap;
    opacity:0; animation: reveal .01s linear 3.0s forwards;
  }
  @keyframes reveal { to { opacity:1; } }
  @keyframes growLine { to { transform:scaleX(1); } }
  @keyframes glitchR { 0%{transform:translate(calc(-50% - 6px),-4px)} 25%{transform:translate(calc(-50% + 5px),3px)} 50%{transform:translate(calc(-50% - 3px),-2px)} 75%{transform:translate(calc(-50% + 6px),4px)} 100%{transform:translate(calc(-50% - 6px),-4px)} }
  @keyframes glitchC { 0%{transform:translate(calc(-50% + 6px),3px)} 25%{transform:translate(calc(-50% - 5px),-4px)} 50%{transform:translate(calc(-50% + 3px),2px)} 75%{transform:translate(calc(-50% - 6px),-3px)} 100%{transform:translate(calc(-50% + 6px),3px)} }
  @keyframes hide { to { opacity:0; } }
  @keyframes settle { to { opacity:1; } }
  @keyframes statIn { to { opacity:1; } }
  @keyframes statGlitch {
    0%   { filter:hue-rotate(0deg) saturate(1); transform:translate(0,0); }
    20%  { filter:hue-rotate(110deg) saturate(4) brightness(1.3); transform:translate(4px,-3px); }
    40%  { filter:hue-rotate(-110deg) saturate(4) brightness(1.3); transform:translate(-4px,3px); }
    60%  { filter:hue-rotate(70deg) saturate(3); transform:translate(3px,2px); }
    80%  { filter:hue-rotate(-70deg) saturate(3); transform:translate(-3px,-2px); }
    100% { filter:hue-rotate(0deg) saturate(1); transform:translate(0,0); }
  }
</style>
</head>
<body>
  <canvas id="bgCanvas" width="1080" height="1350" style="position:absolute;top:0;left:0;z-index:-1"></canvas>
  <script>
    // Exact same background algorithm as _cfBg() in docs/app.html (the
    // real card generator) — pixel-matched to StandardLogo.png. Drawing
    // it with canvas instead of approximating with CSS gradients avoids
    // any anti-aliasing/rendering differences between the two.
    (function(){
      var cv=document.getElementById('bgCanvas');
      var ctx=cv.getContext('2d');
      var W=1080,H=1350,cx=W/2,cy=H/2;
      ctx.fillStyle='#121212';ctx.fillRect(0,0,W,H);
      // carbon twill: the app's body background (20px tile of 4.4px graphite cells) + its two soft page glows (2026-11-17)
      var TILE=20,K=8,tc=document.createElement('canvas');tc.width=TILE*K;tc.height=TILE*K;var tx=tc.getContext('2d');
      function cells(list,col){tx.fillStyle=col;list.forEach(function(p){tx.fillRect(p[0]*K,p[1]*K,4.4*K,4.4*K);});}
      cells([[0,0],[5,0],[0,5],[15,5],[10,10],[15,10],[5,15],[10,15]],'#1E1E1E');
      cells([[10,0],[15,0],[5,5],[10,5],[0,10],[5,10],[0,15],[15,15]],'#161616');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      for(var y=0;y<H;y+=TILE){for(var x=0;x<W;x+=TILE){ctx.drawImage(tc,x,y,TILE,TILE);}}
      function soft(fx,fy,r,rgb,a){var g=ctx.createRadialGradient(W*fx,H*fy,0,W*fx,H*fy,r);
        g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
      soft(.16,.04,620,'255,255,255',.11);soft(.86,.94,560,'166,166,166',.07);
    })();
  </script>
  <div class="stage">
    <div class="tag" id="tag">WEEKLY RECAP</div>
    <div class="logo-wrap">
      <div class="logo-r">CLAIRVOYANCE</div>
      <div class="logo-c">CLAIRVOYANCE</div>
      <div class="logo">CLAIRVOYANCE</div>
    </div>
    <div class="range" id="range">JULY 12 – 18, 2026</div>
    <div class="divider"></div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-val val-record" id="v-record">—</div><div class="stat-lbl">RECORD</div></div>
      <div class="stat"><div class="stat-val val-pct" id="v-pct">—</div><div class="stat-lbl">WIN %</div></div>
      <div class="stat"><div class="stat-val val-units" id="v-units">—</div><div class="stat-lbl">UNITS</div></div>
      <div class="stat"><div class="stat-val val-tag" id="v-extra">7 DAYS</div><div class="stat-lbl" id="v-extra-lbl">TRACKED</div></div>
    </div>
    <div class="footer">clairvoyanceengine.info &nbsp;·&nbsp; X @clairvoyanceeng &nbsp;·&nbsp; IG @clairvoyanceengine</div>
  </div>
</body>
</html>
